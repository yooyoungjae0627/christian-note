# 듣기 페이지(listen/)만 GitHub Pages로 배포한다 — 교재 어학 부록의 ▶ 버튼·QR이 여는 곳(docs/policy/성경_어학학습_부록_지침.md §7)
name: pages
on:
  push:
    branches: [main]
    paths: ["listen/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: listen
      - run: mkdir -p _site && cp -r listen _site/listen && printf '<meta http-equiv="refresh" content="0;url=listen/">' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: d
        uses: actions/deploy-pages@v4
