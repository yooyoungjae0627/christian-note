<div class="slide">
  <div class="title">하나님의 시선</div>
  <div class="verse" style="text-align:left">…그분께서 그 눈먼 사람을 손으로 잡으시고…<br>그의 두 눈에 침을 뱉으시고<br>자신의 두 손을 그에게 올려놓으셨을 때<br>그가 조금 보이는지 그분께서<br>그에게 물으셨더라. 이에 그가…<br><span class="y">"나무들 같은 사람들이 걷고 있는 것을<br>제가 보나이다."</span> 하였더라. 그 뒤에 그분께서<br>자신의 두 손을 그의 두 눈에 다시<br>올려놓으시고 그로 하여금 올려다보게<br>하셨더라. 그러자 그가 회복되어<br><span class="y">모든 사람을 각각 또렷하게 보았더라.</span></div>
  <div class="src">마가복음 8:23-25</div>
</div>
