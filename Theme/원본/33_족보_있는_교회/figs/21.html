  <div class="verse" style="text-align:left">휴거 전에는, 믿음에 더해 아무것도 없이 은혜만으로<br>구원을 받았을 수 있지만(에베소서 2:8-9),<br><span class="y">휴거가 있은 후 1분 뒤부터 십계명과 황금률을 꺼내야 합니다…</span><br>그것들에 의해 심판을 받기 때문입니다(마태복음 25:31-46)…<br>예수님의 흘린 피에 대한 믿음에 <span class="y">더해 행위들이 있어야 합니다.</span>—<br>구약 시대에 믿음에 행위들이 필요했던 것과 똑같이요.</div>
  <div class="src">「수백만 명이 사라진다」, 23p·26p</div>
