<div class="slide">
  <div class="title">유대인의 시대</div>
  <div class="verse" style="text-align:left">믿은 자들의 무리가 한 마음 한 혼이 되어 <span class="y">모든 것을 공동으로 소유하고…</span><br>그 판 것들의 값을 가져다가 사도들의 발 앞에 두매<br>그들이 각 사람에게 필요한 대로 나누어 주었기 때문이더라.</div>
  <div class="verse" style="text-align:left"><span class="y">누구든지 하나님께로부터 태어난 자는 죄를 짓지 아니하느니라.</span><br>이는 그분의 씨가 그의 안에 남아 있기 때문이라.<br>그런즉 그는 죄를 지을 수 없나니, 그가 하나님께로부터 태어난 까닭이라.</div>
  <div class="src">사도행전 4:32, 34-35 (흠정역) / 요한일서 3:9</div>
</div>
