  <div class="title"><span class="k">부자가 되려는 자</span></div>
  <div class="verse" style="text-align:left"><p>…예수님께서…이같이 말씀하시니라.<br>“자녀들아, <span class="k">재물</span>들을 <span class="r">신뢰</span>하는 자들은 하나님의 왕국 안으로<br>들어가기가 얼마나 어려운가! <span class="k">부유한 사람</span>이 하나님의 왕국에<br>들어가는 것보다 낙타가 바늘귀를 통과하는 것이 더 쉬우니라.”<br>그러자 그들이 아주 깜짝 놀라며 자기들끼리 말하기를,<br>“그렇다면 누가 구원받을 수 있겠는가?” 하였더라.</p><p class="gap"><span class="k">부자</span>가 되려고 애쓰지 말라. 너 자신의 <span class="k">지혜</span>에 의존하기를 그치라.</p></div>
  <div class="src">마가복음 10:24-26 / 잠언 23:4</div>
