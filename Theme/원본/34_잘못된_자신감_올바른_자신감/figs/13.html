  <div class="verse" style="text-align:left"><p>… <span class="k">사람</span>을 <span class="r">신뢰</span>하고, <span class="k">육신</span>을 <span class="r">자신의 병기로 삼으며</span>,<br>그의 마음이 주로부터 떠나는 사람은 <span class="r">저주</span>받기를 바라노라.</p><p class="gap">그들은 이집트로 내려가려고 걸으면서 내 입에 묻지 아니하였나니,<br><span class="k">파라오</span>의 힘으로 <span class="r">자신들을 강하게</span> 하려는 것이요,<br>이집트의 그늘을 <span class="r">신뢰</span>하려는 것이로다!<br>그러므로 <span class="k">파라오</span>의 힘이 너희의 <span class="r">수치</span>가 될 것이요,<br>이집트의 그늘을 <span class="r">신뢰</span>하는 것이 너희의 <span class="r">당혹감</span>이 되리라…<br><span class="k">도움</span>을 얻으려고 이집트로 내려가는 자들에게 <span class="r">화</span>가 있기를 바라노라…</p></div>
