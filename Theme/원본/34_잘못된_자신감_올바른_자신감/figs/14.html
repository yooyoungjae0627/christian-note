  <div class="verse" style="text-align:left"><p><span class="G">주</span>께서 <span class="g">내 편</span>이시니, 나는 두려워하지 아니하리라.<br><span class="k">사람</span>이 나에게 무엇을 할 수 있겠느냐?<br><span class="G">주</span>께서 나를 돕는 자들과 함께 <span class="g">나의 편</span>이 되시는도다.<br>그러므로 나의 열망이 나를 증오하는 자들 위에 임하는 것을 내가 보리라.<br>주를 신뢰하는 것이 <span class="k">사람</span>에게 확신을 두는 것보다 낫도다.<br>주를 신뢰하는 것이 <span class="k">통치자</span>들에게 확신을 두는 것보다 낫도다.</p></div>
