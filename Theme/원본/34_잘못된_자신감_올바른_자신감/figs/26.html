  <div class="title tg">올바른 자신감: <span class="tsub">대인관계</span></div>
  <div class="verse" style="text-align:left"><p>사람의 길들이 <span class="g">주를 기쁘게 해 드릴 때</span><br>그분께서는 그의 <span class="r">모든 원수들</span>까지도 그와 <span class="g">화평하게</span> 하시느니라.</p><p class="gap">…그들이 매일 성전 안에서 <span class="g">한뜻</span>이 되어 계속 거하여 집집마다 돌아가며<br>빵을 찢고 자신들의 음식을 <span class="g">하나 된 마음</span>으로 즐겁게 먹으면서<br><span class="g">하나님을 찬송</span>하였으니, <span class="g">모든 백성에게서 호의</span>를 얻었더라. 그리하여<br>주께서 교회에 그와 같이 <span class="g">구원받아야 할 자들</span>을 매일 더해주셨더라.</p></div>
