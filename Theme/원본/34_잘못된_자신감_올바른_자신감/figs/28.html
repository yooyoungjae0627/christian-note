<div class="slide">
  <div class="title tg">영이 가난한 자</div>
  <div class="verse" style="text-align:left"><p>“…멀리 떨어져 서 있던 <span class="g">세리</span>는 그의 두 눈을 하늘에 들어 올리지조차<br>못하고 다만 자기 <span class="g">가슴을 치면서</span> 말하기를,<br>‘하나님께서 <span class="g">죄인인 저</span>에게 자비를 베풀어 주시길 바라나이다.’<br>하였느니라. 내가 너희에게 이르노니,<br>다른 한 명보다도 오히려 이 사람이 정당함을 입증받아<br>자기 집으로 내려갔느니라.<br>이는 <span class="k">스스로를 크게 높이는</span> 모든 자마다 <span class="r">낮춰질 것</span>이요,<br><span class="g">스스로를 겸손하게 하는</span> 자는 크게 <span class="g">높여질 것</span>이기 때문이라.”</p></div>
  <div class="src">누가복음 18:13-14</div>
