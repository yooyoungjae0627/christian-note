<title>밀크 9 구절 테스트 23회차</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#07090D;
  --stage:#0C1119;
  --stage-2:#0F1620;
  --edge:#1E2836;
  --edge-2:#2C3949;
  --ink:#F2F4F8;
  --dim:#94A0B2;
  --faint:#5D6878;
  --gold:#D8B36B;
  --gold-dim:#A98B4E;
  --hl-y:#FFE14D;
  --hl-r:#FF7A6E;
  --hl-o:#FFAE57;
  --hl-b:#7FBCFF;
  --hl-g:#9BE87F;
  --hl-p:#C9A9FF;
  --hl-w:#FFFFFF;
  --ok:#6FD79B;
  --ok-soft:#122019;
  --ok-line:#2C5B41;
  --no:#FF6B60;
  --no-soft:#22120F;
  --no-line:#5C2E28;
  --sans:"Noto Sans KR", system-ui, -apple-system, "Malgun Gothic", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased; padding-bottom:108px;
}
.wrap{max-width:860px; margin:0 auto; padding:0 18px}

/* ============ 상단 ============ */
header.top{
  position:sticky; top:0; z-index:20;
  background:rgba(7,9,13,.92); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--edge);
}
.top-inner{max-width:860px; margin:0 auto; padding:12px 18px 10px; display:flex; flex-direction:column; gap:8px}
.brand{
  font-family:var(--mono); font-size:11px; letter-spacing:.22em; text-transform:uppercase;
  color:var(--gold-dim); margin:0;
}
h1{font-size:20px; font-weight:700; margin:0; letter-spacing:-.01em; color:var(--ink)}
.sub{margin:0; color:var(--dim); font-size:12.5px}
.meter{display:flex; align-items:center; gap:12px}
.bar{flex:1; height:4px; border-radius:99px; background:var(--edge); overflow:hidden}
.bar > i{display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--gold-dim),var(--gold)); transition:width .35s cubic-bezier(.2,.7,.3,1)}
.count{font-family:var(--mono); font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums; white-space:nowrap}
.count b{color:var(--gold); font-weight:500}

/* ============ 슬라이드 공통 ============ */
.slide{
  position:relative;
  background:linear-gradient(160deg,#0E1520 0%,#0A0F17 55%,#0C121B 100%);
  border:1px solid var(--edge);
  border-radius:3px;
  padding:20px 26px 18px;
  box-shadow:0 24px 60px -40px #000, inset 0 1px 0 rgba(255,255,255,.03);
}
.cat{
  text-align:right; font-weight:700; font-size:15px; color:var(--gold);
  letter-spacing:-.01em; margin:0 0 16px; word-break:keep-all;
}
.verse{
  margin:0; font-size:17.5px; line-height:2.15; font-weight:400;
  color:var(--ink); white-space:pre-line; word-break:keep-all;
  letter-spacing:-.005em;
}
.hl-n{
  background:#B9E86B; color:#12200E; font-weight:600;
  border-radius:2px; padding:.06em .18em; margin:0 .02em;
  box-decoration-break:clone; -webkit-box-decoration-break:clone;
}
.hl-y, .hl-k{
  background:#F7DE72; color:#15202B; font-weight:500;
  border-radius:2px; padding:.06em .18em; margin:0 .02em;
  box-decoration-break:clone; -webkit-box-decoration-break:clone;
}
.hl-k{
  text-decoration:underline; text-decoration-thickness:1.5px;
  text-underline-offset:3px; text-decoration-color:rgba(21,32,43,.55);
}
.hl-r{color:var(--hl-r); font-weight:600}
.hl-o{color:var(--hl-o); font-weight:600}
.hl-b{color:var(--hl-b); font-weight:600}
.hl-g{color:var(--hl-g); font-weight:600}
.hl-p{color:var(--hl-p); font-weight:600}
.hl-w{color:var(--hl-w); font-weight:600}
.vlink-row{margin:0 0 12px; line-height:1}
.vlink{display:inline-block; font-family:var(--mono); font-size:12px; color:var(--hl-b); text-decoration:none; border:1px solid var(--edge-2); border-radius:99px; padding:4px 11px; background:rgba(127,188,255,.06)}
.vlink:hover{border-color:var(--hl-b); background:rgba(127,188,255,.14)}
.themes{display:flex; flex-wrap:wrap; gap:6px; margin-top:7px}
.theme{display:inline-block; padding:2px 9px; border-radius:3px; font-size:12px; font-weight:600; letter-spacing:.01em; line-height:1.7}
.th-jew{background:#F3E3A0; color:#3A3010}
.th-gen{background:#F0A36B; color:#3A1C08}
.th-mil{background:#7DB3EE; color:#0B2440}
.th-nhe{background:transparent; color:#F0A36B; border:1.5px solid #F0A36B}
.uses{display:block; margin-top:5px; font-size:12px; font-weight:400; color:var(--faint)}
.cat-none{color:var(--faint); font-weight:400; font-size:12px; letter-spacing:.02em}
.rule{height:1px; background:var(--edge-2); margin:20px 0 12px}
.slide-foot{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.pagenum{font-family:var(--mono); font-size:12px; color:var(--faint); font-variant-numeric:tabular-nums}

/* ============ 입력 ============ */
.answer-row{display:flex; gap:6px; align-items:stretch; flex:1; justify-content:flex-end; flex-wrap:wrap}
input.ans{
  flex:0 1 300px; min-width:0; text-align:right;
  font-family:var(--sans); font-size:15px; font-weight:500; color:var(--ink);
  padding:8px 12px; border:1px solid var(--edge-2); border-radius:3px;
  background:rgba(255,255,255,.03); transition:border-color .15s, box-shadow .15s;
}
input.ans::placeholder{color:var(--faint); font-weight:400}
input.ans:focus{outline:none; border-color:var(--gold-dim); box-shadow:0 0 0 3px rgba(216,179,107,.12)}
button{font-family:var(--sans); cursor:pointer; border-radius:3px; transition:background .15s, border-color .15s, color .15s}
button:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
.btn-check{padding:8px 15px; font-size:13.5px; font-weight:500; border:1px solid var(--gold-dim); background:rgba(216,179,107,.14); color:var(--gold)}
.btn-check:hover{background:rgba(216,179,107,.24)}
.btn-peek{padding:8px 11px; font-size:12.5px; color:var(--dim); border:1px solid var(--edge-2); background:transparent}
.btn-peek:hover{color:var(--ink); border-color:var(--faint)}
.feedback{margin-top:12px; font-size:14px; display:none; align-items:center; justify-content:flex-end; gap:8px; font-weight:500; text-align:right}
.feedback.show{display:flex}
.feedback .mark{font-family:var(--mono); font-size:11.5px; letter-spacing:.08em; padding:2px 8px; border-radius:99px; border:1px solid var(--edge-2); background:rgba(255,255,255,.04)}
.feedback.ok{color:var(--ok)} .feedback.ok .mark{background:var(--ok-soft); border-color:var(--ok-line)}
.feedback.no{color:var(--no)} .feedback.no .mark{background:var(--no-soft); border-color:var(--no-line)}
.feedback.hint{color:var(--dim); font-weight:400}
.feedback .truth{color:var(--gold); font-weight:700}

/* ============ 퀴즈 ============ */
.quiz{margin:22px 0 0}
.quiz-top{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:0 4px 8px;
}
.quiz-label{font-family:var(--mono); font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--gold-dim)}
.qcount{font-family:var(--mono); font-size:12.5px; color:var(--dim); font-variant-numeric:tabular-nums}
.qcount b{color:var(--ink); font-weight:500; font-size:15px}
.quiz .slide{border-color:var(--edge-2); box-shadow:0 30px 70px -40px #000, 0 0 0 1px rgba(216,179,107,.08), inset 0 1px 0 rgba(255,255,255,.04)}
.quiz .verse{font-size:18.5px; min-height:5em}
.quiz-controls{display:flex; flex-wrap:wrap; gap:6px; margin-top:16px; padding:0 4px}
.quiz-controls button{padding:7px 12px; font-size:12.5px; color:var(--dim); border:1px solid var(--edge); background:transparent}
.quiz-controls button:hover{color:var(--ink); border-color:var(--edge-2)}
.quiz-controls .spacer{flex:1}
.done{text-align:center; padding:36px 0 30px}
.done h2{font-size:22px; margin:0 0 8px; color:var(--gold)}
.done p{margin:0 0 20px; color:var(--dim); font-size:14px}

/* ============ 목록 ============ */
.list-head{
  display:flex; align-items:baseline; justify-content:space-between; gap:12px;
  margin:38px 0 0; padding-bottom:8px; border-bottom:1px solid var(--edge);
}
.list-head h2{font-size:17px; margin:0; font-weight:700; color:var(--ink)}
.list-head span{font-size:12.5px; color:var(--faint)}
ol.deck{list-style:none; margin:18px 0 0; padding:0; display:flex; flex-direction:column; gap:16px}
.card.correct .slide{border-color:var(--ok-line)}
.card.wrong .slide{border-color:var(--no-line)}
.card.correct input.ans{border-color:var(--ok-line)}
.card.wrong input.ans{border-color:var(--no-line)}
.card{scroll-margin-top:130px}

.score{display:none; margin:18px 0 0; padding:14px 18px; border-radius:3px; border:1px solid var(--gold-dim); background:rgba(216,179,107,.08); font-size:15px; color:var(--ink)}
.score.show{display:block}
.score b{font-family:var(--mono); font-size:19px; font-variant-numeric:tabular-nums; color:var(--gold)}

/* ============ 하단바 ============ */
.dock{position:fixed; left:0; right:0; bottom:0; z-index:30; background:rgba(7,9,13,.94); backdrop-filter:blur(10px); border-top:1px solid var(--edge)}
.dock-inner{max-width:860px; margin:0 auto; padding:10px 18px; display:flex; gap:6px; flex-wrap:wrap}
.dock button{flex:1 1 130px; padding:11px 8px; font-size:13.5px; font-weight:500}
.b-ghost{border:1px solid var(--edge-2); background:transparent; color:var(--dim)}
.b-ghost:hover{color:var(--ink)}
.b-outline{border:1px solid var(--edge-2); background:transparent; color:var(--ink)}
.b-outline:hover{border-color:var(--gold-dim); color:var(--gold)}
.b-outline[aria-pressed="true"]{border-color:var(--gold-dim); background:rgba(216,179,107,.12); color:var(--gold)}
.b-grade{border:1px solid var(--gold-dim); background:rgba(216,179,107,.16); color:var(--gold)}
.b-grade:hover{background:rgba(216,179,107,.26)}
footer.end{margin:30px 0 8px; text-align:center; font-size:11.5px; color:var(--faint); font-family:var(--mono); letter-spacing:.06em}
@media (max-width:600px){
  h1{font-size:18px}
  .slide{padding:16px 16px 14px}
  .verse{font-size:16px; line-height:1.95}
  .quiz .verse{font-size:16.5px}
  .cat{font-size:13.5px}
  input.ans{flex:1 1 100%; text-align:left}
  .dock button{flex:1 1 45%; font-size:12.5px}
}
@media (prefers-reduced-motion: reduce){*{transition:none !important; scroll-behavior:auto !important}}
</style>

<header class="top">
  <div class="top-inner">

<script>
const DATA = [
{th:["jew"], u:[],
 cat:"주의 날 1: 올리브 산", b:"사도행전", c:1,
 hl:[["n","너희가 하늘로 가심을 본 그대로 오시리라"]],
 t:`주께서 올라가실 때에 그들이 하늘을 주시하고 있는데, 보라, 흰 옷을 입은 두 사람이 그들 곁에 서서
말하기를 “너희 갈릴리 사람들아, 어찌하여 너희는 하늘을 쳐다보고 서 있느냐? 너희를 떠나 하늘로 들려 올라가신 바로 이 예수는 너희가 하늘로 가심을 본 그대로 오시리라.”고 하더라.
그후에 그들은 올리브 산이라 하는 곳에서 예루살렘으로 돌아왔는데 이 산은 예루살렘에서 가까워 안식일에 다닐 수 있는 거리더라.`},

{th:["jew"], u:[],
 cat:"주의 날 1: 올리브 산", b:"스가랴", c:14,
 hl:[["n","그분의 두 발은 예루살렘 앞 동쪽에 있는 올리브산 위에 서시리니"]],
 t:`그리고 그날에 그분의 두 발은 예루살렘 앞 동쪽에 있는 올리브산 위에 서시리니, 올리브산은 그곳의 중심부에서 동쪽과 서쪽으로 갈라질 것이요, 거기에 매우 거대한 골짜기가 생기리라. 그리고 그 산의 절반은 북쪽을 향하여, 그곳의 절반은 남쪽을 향하여 움직이리라.
그리고 주께서 온 땅을 다스리시는 왕이 되시리라. 그날에는 유일하신 주만 계실 것이요, 그분의 이름만 유일하리라.`},

{th:["jew"], u:[],
 cat:"주의 날 1: 올리브 산", b:"다니엘", c:7,
 hl:[["n","인자와 같은 이가 하늘의 구름들과 함께 오셨고"]],
 t:`내가 밤의 현시들 가운데서 보았더니, 보라, 인자와 같은 이가 하늘의 구름들과 함께 오셨고, 태고의 날들부터 계시는 분께 나아오셨는데 그들이 그를 그분 앞으로 가까이 모셨더라.
그러자 거기에서 그에게 통치권과 영광과 왕국이 주어졌더라. 이는 모든 백성들과 민족들과 언어들이 그를 섬기게 하려 함이라. 그의 통치권은 영원한 통치권이요, 사라지지 아니할 통치권이니, 그의 왕국은 멸망하지 아니할 왕국이라.`},

{th:["jew"], u:[],
 cat:"환란 후반 유혹", b:"마태복음", c:24,
 hl:[["n","‘보라, 그리스도가 여기 있다. 혹은 저기 있다.’ 할지라도 그것을 믿지 말라"]],
 t:`그때 만일 어떤 사람이 너희에게 ‘보라, 그리스도가 여기 있다. 혹은 저기 있다.’ 할지라도 그것을 믿지 말라.
이는 거짓 그리스도들과 거짓 예언자들이 일어날 것이요, 대단한 표적들과 이적들을 보일 것이기 때문이라. 만일 가능하다면 저들은 바로 그 택함받은 자들까지도 속일 것이라.
보라, 내가 너희에게 미리 알려주었노라.
이러한 이유로 만일 그들이 너희에게 ‘보라, 그가 사막에 있다.’ 말할지라도, 나가지 말라. ‘보라, 그가 밀실들에 있다.’ 할지라도 그것을 믿지 말라.`},

{th:["jew"], u:[],
 cat:"주의 날 1: 특징", b:"마태복음", c:24,
 hl:[["n","해가 어두워지며, 달이 그 빛을 내지 아니하며"],["n","사방에서 그의 택하신 사람들을 함께 모을 것이라"]],
 t:`그 날들의 환란 후에 즉시 해가 어두워지며, 달이 그 빛을 내지 아니하며, 별들이 하늘에서 떨어지고, 또 하늘들의 권능들이 흔들릴 것이라.
그후에 하늘에 있는 인자의 표적이 나타나리니, 땅의 모든 지파들이 통곡할 것이며, 또 그들은 인자가 권세와 큰 영광으로 하늘의 구름을 타고 오는 것을 보리라.
또 주께서 큰 나팔 소리와 함께 천사들을 보내시리니, 그들이 하늘 이편 끝에서 저편 끝까지 사방에서 그의 택하신 사람들을 함께 모을 것이라.`},

{th:["jew"], u:[],
 cat:"주의 날 1: 특징", b:"요엘", c:2,
 hl:[["n","주의 위대하고 두려운 날이 오기 전에 해가 흑암으로, 달이 피로 변하리라"]],
 t:`너희는 시온에서 나팔을 불고 내 거룩한 산에서 경고의 소리를 내어 그 땅의 모든 거민들로 떨게 하라. 이는 주의 날이 오며 그 날이 가까움이라.
흑암과 암영의 날, 구름과 짙은 어두움의 날이 산들 위에 펼쳐진 아침 같으니, 많고 강한 사람들이라. 이 같은 일은 전에도 없었고, 또 이후, 곧 많은 세대들의 연수에까지도 다시 없으리라...
땅이 그들 앞에서 흔들리며 하늘들이 떨고 해와 달이 어두워지며 별들이 그들의 빛을 거두리라...
주의 위대하고 두려운 날이 오기 전에 해가 흑암으로, 달이 피로 변하리라.`},

{th:["jew"], u:["밀크 7강 · 하나의 교회: 제자들"],
 cat:"주의 날 1: 특징", b:"사도행전", c:2,
 hl:[["n","저 중대하고 현저한, 주의 날이 오기 전에 해가 어둠으로 변할 것이요, 달은 피로 변하리라"]],
 t:`그러나 열한 명과 함께 일어선 베드로가 그의 목소리를 높여서 그들에게 이같이 말하였더라. “유대 사람들인 너희여, 그리고 예루살렘에 거하는 너희 모두여, 이것이 너희에게 알려지기를 바라노라. 그런즉 나의 말들에 경청하라.
그러나 이것은 예언자 요엘에 의하여 언급된 바라.
‘그리하여 마지막 날들에 이러한 일들이 있으리니, 하나님께서 이같이 말씀하시니라. ‘내가 나의 영을 모든 육체 위에 쏟아붓겠노라. 그리하면 너희의 아들들과 너희의 딸들이 예언할 것이요, 너희의 청년들은 현시들을 볼 것이요, 너희의 노인들은 꿈들을 꾸리라.
저 중대하고 현저한, 주의 날이 오기 전에 해가 어둠으로 변할 것이요, 달은 피로 변하리라.`},

{th:["mil"], u:["밀크 7강 · 제사장들의 왕국: 에덴의 회복"],

하늘의 별들이 마치 무화과나무가 강한 바람에 흔들려 설익은 무화과가 떨어지듯이 땅에 떨어지며
하늘은 두루마리같이 말려서 쓸려 가고 모든 산과 섬도 각기 제자리에서 옮겨졌으니
이는 그분의 진노의 큰 날이 임하였음이니 누가 감히 설 수 있으리요?” 하더라.`},

{th:["jew"], u:[],
 cat:"주의 날 1", b:"데살로니가전서", c:5,
 hl:[["n","주의 날이 밤에 도둑같이 그렇게 오는 것을"]],
 t:`그러나 형제들아, 그 때들과 그 시기들에 대해서는 내가 너희에게 쓰는 것이 너희에게 전혀 필요하지 아니하노라.
이는 주의 날이 밤에 도둑같이 그렇게 오는 것을 너희 자신이 완전히 알고 있기 때문이라.
이는 그들이 말하기를, “평안하고 안전하다.” 할 그때 갑작스러운 멸망이 그들에게 임하기 때문이니, 아이를 가진 여자에게 산고가 임하는 것과 같으니라. 그런즉 그들은 벗어나지 못하리라.
그러나 형제들아, 너희는 어둠 속에 있지 아니하니, 그날이 도둑같이 너희를 엄습하지 못하게 하려는 것이라.
너희 모두는 빛의 자녀들이요, 낮의 자녀들이라. 우리는 밤에 속하지도 아니하고, 어둠에 속하지도 아니하니라.`},

{th:["jew"], u:[],

또 괴롭힘을 당하는 너희에게 우리와 더불어 안식으로 갚아주시는 것도 하나님께는 의로운 일이므로, 주 예수께서 그분의 막강한 천사들과 함께 하늘에서부터 나타나 보이실 때,
하나님을 모르는 자들과 우리 주 예수 그리스도의 복음에 순종하지 않는 자들에게 맹렬한 불속에서 복수하시리라.`},

{th:["jew"], u:[],

{th:["jew"], u:[],
 cat:"제사장 심판: 달란트의 비유", b:"마태복음", c:25,

그런데 그가 한 명에게는 오 달란트를, 또 다른 이에게는 이 달란트를, 또 다른 이에게는 일 달란트를 주었으니, 각 사람에게 그의 개별적인 재능에 따라 주었더라. 그러고 나서 즉각 자신의 여정을 떠났더라.
오랜 시간 뒤에 그 종들의 소유주가 와서 그들과 계산하니라.`},

{th:["jew"], u:[],

너희가 아브라함과 이삭과 야곱과 모든 예언자들을 하나님의 왕국에서 보고, 너희 자신은 내쫓긴 것을 볼 때에 거기에서 울며 이를 가는 일이 있으리라.
그리고 그들이 동방에서와 서방에서와 북방에서와 남방에서 올 것이요, 하나님의 왕국에 앉으리라.`},

{th:["jew"], u:[],

{th:["jew"], u:[],

기록된 심판을 그들에게 집행하기 위함이라. 이런 존귀가 그분의 모든 성도들에게 있도다. 너희는 주를 찬송하라.`},

{th:["jew"], u:[],

{th:["jew"], u:[],

{th:["mil"], u:[],

나가서 땅의 사방에 있는 민족들, 곧 곡과 마곡을 속이고 그들을 함께 모아 전투를 하게 할 것이라. 그들의 수는 바다의 모래 같으니라.
그리고 그들은 땅의 넓은 곳 위로 올라갔고 성도들의 진영과 그 사랑받는 도성을 포위하였더라. 그러자 하늘에서 하나님께로부터 불이 내려와서 그들을 집어삼켰더라.
그리고 그들을 속인 마귀는 그 짐승과 그 거짓 예언자가 있는 불과 유황의 호수 속으로 던져졌으니, 영원무궁토록 주야로 심히 고통당하게 되리라.`},

{th:["mil"], u:[],

그러고 나서 내가 죽은 자들이 작은 자, 큰 자 할 것 없이 하나님 앞에 서 있는 것을 보았는데 책들이 펼쳐졌더라. 그리고 또 다른 책이 펼쳐졌는데 그것은 생명책이라. 그리하여 죽은 자들이 자신들의 행위들에 따라 책들 안에 기록된 그것들대로 심판을 받았더라.`},

{th:["mil"], u:[],

 t:`그리고 바다가 그 안에 있던 죽은 자들을 내어 주었고 사망과 지옥도 그것들 안에 있던 죽은 자들을 넘겨주었더라. 그러자 그들 각인이 자신들의 행위들에 따라 심판을 받았더라.
그리고 사망과 지옥도 불의 호수 속에 던져졌더라. 이것이 둘째 사망이라.
그리고 누구든지 생명책 안에 기록된 것이 발견되지 않은 자는 불의 호수 속에 던져졌더라.`},

{th:["nhe"], u:[],

하나님의 날이 오는 것을 고대하고 서두르라. 그날에 하늘들이 불붙어 분해될 것이요, 원소들은 뜨거운 열로 녹을 것이라.
그럼에도 불구하고 우리는 그분의 약속에 따라 의가 그 안에 거하는 새 하늘들과 새 땅을 고대하는도다.`},

const LOOKUP = {};
for (const [canon, list] of Object.entries(ALIAS)) {
  LOOKUP[canon] = canon;
  list.forEach(a => { LOOKUP[a] = canon; });
}
function parseAnswer(raw){
  let s = (raw || "").replace(/[\s ]+/g, "").replace(/[.,;·・~\-–—]/g, "").replace(/장$/,"").trim();
  if (!s) return {ok:false, why:"empty"};
  const m = s.match(/^(\D+?)(\d+)/);
  if (!m) return {ok:false, why:"nochapter"};
  const bookRaw = m[1];
  const chapter = parseInt(m[2], 10);
  const canon = LOOKUP[bookRaw] || LOOKUP[bookRaw.replace(/서$/,"")] || LOOKUP[bookRaw + "서"];
  if (!canon) return {ok:false, why:"nobook", chapter};
  return {ok:true, book:canon, chapter};
}
function answerOf(item){ return item.b + " " + item.c + "장"; }
function whyText(why){
  return why === "empty" ? "답을 입력해 주세요."
    : why === "nochapter" ? "장 번호까지 함께 적어 주세요. 예: 마태복음 17"
    : "책 이름을 알아볼 수 없어요. 예: 마태복음 17 · 마17 · 행 5";
}
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function paintItem(item, only){
  const t = item.t, ranges = [];
  (item.hl || []).filter(x => !only || x[0] === only).forEach(([k, str]) => {
    let from = 0, idx;
    while ((idx = t.indexOf(str, from)) !== -1) {
      const s = idx, e = idx + str.length;
      if (!ranges.some(r => s < r.e && e > r.s)) { ranges.push({s, e, k}); break; }
      from = idx + 1;
    }
  });
  ranges.sort((a, b) => a.s - b.s);
  let out = "", pos = 0;
  for (const r of ranges) {
    out += esc(t.slice(pos, r.s)) + '<span class="hl-' + r.k + '">' + esc(t.slice(r.s, r.e)) + "</span>";
    pos = r.e;
  }
  return out + esc(t.slice(pos));
}
function toSec(v){ return v.split(":").reduce((a, n) => a * 60 + parseInt(n, 10), 0); }
function linkHtml(item){
  if (!item.v || typeof VIDEO === "undefined") return "";
  return '<a class="vlink" href="' + VIDEO + '&t=' + toSec(item.v) + 's" target="_blank" rel="noopener">▶ 강의 영상 ' + esc(item.v) + '부터</a>';
}
const THEMES = {
  jew:{label:"유대인의 시대 · 제사장", cls:"th-jew"},
  gen:{label:"이방인의 시대 · 신부",   cls:"th-gen"},
  mil:{label:"천년왕국",               cls:"th-mil"},
  nhe:{label:"새 하늘 새 땅",          cls:"th-nhe"}
};
function themeHtml(item){
  let h = "";
  if (item.th && item.th.length) h += "<span class=\"themes\">" + item.th.map(k => "<span class=\"theme " + THEMES[k].cls + "\">" + THEMES[k].label + "</span>").join("") + "</span>";
  if (item.u && item.u.length) h += "<span class=\"uses\">다른 강의: " + item.u.map(esc).join(" · ") + "</span>";
  return h;
}
function catHtml(item){
  return item.cat ? "<p class=\"cat\">" + esc(item.cat) + themeHtml(item) + "</p>"
                  : "<p class=\"cat cat-none\">카테고리 미확인 (슬라이드 주시면 반영)" + themeHtml(item) + "</p>";
}

/* ---------- 공용 상태 ---------- */
const deck = document.getElementById("deck");
const progressBar = document.getElementById("progressBar");
const doneCount = document.getElementById("doneCount");
const scoreBox = document.getElementById("scoreBox");
const solved = new Set();
const attempted = new Set();   /* 퀴즈에서 이미 제출한 문항 */
let order = DATA.map((_, i) => i);
let revealAll = false;
const el = id => document.getElementById(id);

el("total").textContent = DATA.length;
el("totalCount").textContent = DATA.length;
el("qTotal").textContent = DATA.length;
el("footTotal").textContent = DATA.length;

function updateProgress(){
  const pct = DATA.length ? (solved.size / DATA.length) * 100 : 0;
  doneCount.textContent = solved.size;
  progressBar.style.width = pct + "%";
}

/* ================= 퀴즈 모드 ================= */
const qBody = el("quizBody");
const savedQuizMarkup = qBody.innerHTML;
let quizPos = 0;
let advanceTimer = null;

function qSetFeedback(kind, mark, msg){
  const fb = el("qFeedback"); if (!fb) return;
  fb.className = "feedback show " + kind;
  fb.querySelector(".mark").textContent = mark;
  fb.querySelector(".msg").innerHTML = msg;
}
function qClearFeedback(){
  const fb = el("qFeedback"); if (!fb) return;
  fb.className = "feedback";
  fb.querySelector(".mark").textContent = "";
  fb.querySelector(".msg").innerHTML = "";
}
function allSolved(){ return solved.size >= DATA.length; }

function renderQuiz(){
  clearTimeout(advanceTimer);
  if (allSolved()) { renderQuizDone(); return; }
  if (!el("qVerse")) qBody.innerHTML = savedQuizMarkup;
  if (quizPos < 0) quizPos = order.length - 1;
  if (quizPos >= order.length) quizPos = 0;
  const idx = order[quizPos];
  const item = DATA[idx];
  const ql = el("qLink"); if (ql) { ql.innerHTML = linkHtml(item); ql.style.display = item.v ? "" : "none"; }
  el("qCat").outerHTML = catHtml(item).replace('class="cat', 'id="qCat" class="cat');
  el("qVerse").innerHTML = paintItem(item, "n");   /* 퀴즈는 핵심(연두)만 */
  el("qNum").textContent = String(quizPos + 1).padStart(2, "0");
  el("qPos").textContent = quizPos + 1;
  el("qInput").value = "";
  qClearFeedback();
  if (solved.has(idx)) qSetFeedback("ok", "정답", '이미 맞힌 문제 · <span class="truth">' + answerOf(item) + "</span>");
  updateProgress();
}
function renderQuizDone(){
  clearTimeout(advanceTimer);
  const total = DATA.length;
  qBody.innerHTML =
    '<div class="slide"><div class="done">' +
      '<h2>' + total + ' / ' + total + ' 정답</h2>' +
      '<p>전부 맞히셨습니다. 수고하셨습니다.</p>' +
      '<div class="quiz-controls" style="justify-content:center; border:0; padding:0">' +
        '<button class="btn-peek" id="qRestart" type="button">처음부터 다시 풀기</button>' +
      '</div>' +
    '</div></div>';
  el("qPos").textContent = total;
  updateProgress();
}
function renderQuizAndFocus(){
  renderQuiz();
  const i = el("qInput");
  if (i) { i.focus({preventScroll:true}); i.select(); }
}
function quizNext(){
  for (let step = 1; step <= order.length; step++) {
    const p = (quizPos + step) % order.length;
    if (!solved.has(order[p])) { quizPos = p; renderQuizAndFocus(); return; }
  }
  renderQuizDone();
}
function quizPrev(){ quizPos = (quizPos - 1 + order.length) % order.length; renderQuizAndFocus(); }
function quizSkip(){ quizPos = (quizPos + 1) % order.length; renderQuizAndFocus(); }

function quizCheck(){
  const input = el("qInput");
  if (!input) return;
  const idx = order[quizPos];
  const item = DATA[idx];
  if (solved.has(idx) && !input.value.trim()) { quizNext(); return; }
  const res = parseAnswer(input.value);
  if (!res.ok) { qSetFeedback("hint", "확인", whyText(res.why)); return; }
  const right = (res.book === item.b && res.chapter === item.c);
  if (right) {
    solved.add(idx);
    attempted.add(idx);
    syncListCard(idx, input.value, true);
    qSetFeedback("ok", "정답", '<span class="truth">' + answerOf(item) + "</span>");
    updateProgress();
    clearTimeout(advanceTimer);
    advanceTimer = setTimeout(quizNext, 800);
  } else {
    /* 틀리면 다음 문제로 넘어가지 않고 같은 문제에 머무릅니다 */
    solved.delete(idx);
    syncListCard(idx, input.value, false);
    qSetFeedback("no", "오답", '다시 입력해 보세요. 정답을 보시려면 아래 <b>정답 보기</b>를 누르세요.');
    updateProgress();
    clearTimeout(advanceTimer);
    input.focus({preventScroll:true});
    input.select();
  }
}

qBody.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "qInput") { e.preventDefault(); quizCheck(); }
});
qBody.addEventListener("input", e => {
  if (e.target.id !== "qInput") return;
  const fb = el("qFeedback");
  if (fb && fb.classList.contains("no")) qClearFeedback();
});
qBody.addEventListener("click", e => {
  const id = e.target.id;
  if (id === "qCheck") quizCheck();
  else if (id === "qPrev") quizPrev();
  else if (id === "qSkip") quizSkip();
  else if (id === "qRestart") resetAll();
  else if (id === "qPeek") qSetFeedback("hint", "정답", '<span class="truth">' + answerOf(DATA[order[quizPos]]) + "</span>");
});
document.addEventListener("click", e => {
  if (e.target.id === "qShuffle") { shuffleOrder(); quizPos = 0; renderQuizAndFocus(); }
});

/* ================= 전체 목록 ================= */
function render(){
  deck.innerHTML = "";
  order.forEach((idx, pos) => {
    const item = DATA[idx];
    const li = document.createElement("li");
    li.className = "card";
    li.dataset.idx = idx;
    li.innerHTML =
      '<div class="slide">' +
        (item.v ? '<p class="vlink-row">' + linkHtml(item) + '</p>' : '') +
        catHtml(item) +
        '<p class="verse">' + paintItem(item) + '</p>' +
        '<div class="rule"></div>' +
        '<div class="slide-foot">' +
          '<span class="pagenum">' + String(pos + 1).padStart(2, "0") + '</span>' +
          '<div class="answer-row">' +
            '<input class="ans" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="책 이름과 장" aria-label="' + (pos + 1) + '번 답 입력">' +
            '<button class="btn-check" type="button">확인</button>' +
            '<button class="btn-peek" type="button">정답</button>' +
          '</div>' +
        '</div>' +
        '<div class="feedback"><span class="mark"></span><span class="msg"></span></div>' +
      '</div>';
    deck.appendChild(li);
  });
  if (revealAll) applyReveal(true);
  updateProgress();
}
function cardState(c){ return c.classList.contains("correct") ? "correct" : c.classList.contains("wrong") ? "wrong" : "none"; }
function setFeedback(card, kind, mark, msg){
  const fb = card.querySelector(".feedback");
  fb.className = "feedback show " + kind;
  fb.querySelector(".mark").textContent = mark;
  fb.querySelector(".msg").innerHTML = msg;
}
function clearCard(card){
  card.classList.remove("correct", "wrong");
  const fb = card.querySelector(".feedback");
  fb.className = "feedback";
  fb.querySelector(".mark").textContent = "";
  fb.querySelector(".msg").innerHTML = "";
  solved.delete(+card.dataset.idx);
}
function check(card, {advance = false} = {}){
  const idx = +card.dataset.idx;
  const item = DATA[idx];
  const input = card.querySelector(".ans");
  const res = parseAnswer(input.value);
  if (!res.ok) {
    card.classList.remove("correct", "wrong");
    solved.delete(idx);
    setFeedback(card, "hint", "확인", whyText(res.why));
    updateProgress();
    return "none";
  }
  const right = (res.book === item.b && res.chapter === item.c);
  if (right) {
    card.classList.remove("wrong"); card.classList.add("correct");
    solved.add(idx);
    setFeedback(card, "ok", "정답", '<span class="truth">' + answerOf(item) + "</span>");
  } else {
    card.classList.remove("correct"); card.classList.add("wrong");
    solved.delete(idx);
    setFeedback(card, "no", "오답", '정답은 <span class="truth">' + answerOf(item) + "</span> 입니다.");
  }
  updateProgress();
  if (advance) goNext(card);
  return right ? "correct" : "wrong";
}
function syncListCard(idx, value, right){
  const card = deck.querySelector('.card[data-idx="' + idx + '"]');
  if (!card) return;
  card.querySelector(".ans").value = value;
  if (right) {
    card.classList.remove("wrong"); card.classList.add("correct");
    setFeedback(card, "ok", "정답", '<span class="truth">' + answerOf(DATA[idx]) + "</span>");
  } else {
    card.classList.remove("correct"); card.classList.add("wrong");
    setFeedback(card, "no", "오답", '정답은 <span class="truth">' + answerOf(DATA[idx]) + "</span> 입니다.");
  }
}
function goNext(fromCard){
  const cards = [...deck.children];
  const start = cards.indexOf(fromCard);
  for (let step = 1; step <= cards.length; step++) {
    const c = cards[(start + step) % cards.length];
    if (c.classList.contains("correct")) continue;
    c.scrollIntoView({behavior:"smooth", block:"center"});
    const i = c.querySelector(".ans");
    i.focus({preventScroll:true}); i.select();
    return;
  }
  fromCard.querySelector(".ans").blur();
}
deck.addEventListener("keydown", e => {
  if (e.key !== "Enter" || !e.target.classList.contains("ans")) return;
  e.preventDefault();
  check(e.target.closest(".card"), {advance:true});
});
deck.addEventListener("input", e => {
  if (!e.target.classList.contains("ans")) return;
  const card = e.target.closest(".card");
  if (cardState(card) !== "none") { clearCard(card); updateProgress(); }
});
deck.addEventListener("click", e => {
  const card = e.target.closest(".card");
  if (!card) return;
  if (e.target.classList.contains("btn-check")) check(card, {advance:true});
  else if (e.target.classList.contains("btn-peek")) {
    const idx = +card.dataset.idx;
    card.classList.remove("correct", "wrong");
    solved.delete(idx);
    setFeedback(card, "hint", "정답", '<span class="truth">' + answerOf(DATA[idx]) + "</span>");
    updateProgress();
  }
});

/* ================= 하단 버튼 ================= */
function shuffleOrder(){
  const vals = {};
  [...deck.children].forEach(c => { vals[c.dataset.idx] = c.querySelector(".ans").value; });
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  render();
  [...deck.children].forEach(c => {
    const v = vals[c.dataset.idx];
    if (v) c.querySelector(".ans").value = v;
    if (solved.has(+c.dataset.idx)) {
      c.classList.add("correct");
      setFeedback(c, "ok", "정답", '<span class="truth">' + answerOf(DATA[+c.dataset.idx]) + "</span>");
    }
  });
  updateProgress();
}
function resetAll(){
  solved.clear();
  attempted.clear();
  revealAll = false;
  const rb = el("btnRevealAll");
  rb.setAttribute("aria-pressed", "false");
  rb.textContent = "전체 정답 보기";
  [...deck.children].forEach(c => { c.querySelector(".ans").value = ""; clearCard(c); });
  scoreBox.classList.remove("show");
  quizPos = 0;
  renderQuiz();
  updateProgress();
  window.scrollTo({top:0, behavior:"smooth"});
}
function applyReveal(on){
  [...deck.children].forEach(c => {
    const idx = +c.dataset.idx;
    if (on) {
      if (c.classList.contains("correct")) return;
      c.classList.remove("wrong");
      setFeedback(c, "hint", "정답", '<span class="truth">' + answerOf(DATA[idx]) + "</span>");
    } else if (!c.classList.contains("correct")) {
      clearCard(c);
    }
  });
  updateProgress();
}
el("btnReset").addEventListener("click", resetAll);
el("btnShuffle").addEventListener("click", () => {
  shuffleOrder(); quizPos = 0; renderQuiz();
  scoreBox.classList.remove("show");
  window.scrollTo({top:0, behavior:"smooth"});
});
el("btnRevealAll").addEventListener("click", e => {
  revealAll = !revealAll;
  const b = e.currentTarget;
  b.setAttribute("aria-pressed", String(revealAll));
  b.textContent = revealAll ? "정답 숨기기" : "전체 정답 보기";
  applyReveal(revealAll);
  if (revealAll) document.querySelector(".list-head").scrollIntoView({behavior:"smooth", block:"start"});
});
el("btnGrade").addEventListener("click", () => {
  let right = 0, blank = 0;
  [...deck.children].forEach(c => {
    const i = c.querySelector(".ans");
    if (!i.value.trim()) { blank++; clearCard(c); return; }
    if (check(c) === "correct") right++;
  });
  let msg = '<b>' + right + '</b> / ' + DATA.length + ' 정답';
  if (blank > 0) msg += ' <span style="color:var(--dim)">· 미입력 ' + blank + '문항</span>';
  msg += ' <span style="color:var(--dim)">· 정답률 ' + Math.round((right / DATA.length) * 100) + '%</span>';
  scoreBox.innerHTML = msg;
  scoreBox.classList.add("show");
  updateProgress();
  scoreBox.scrollIntoView({behavior:"smooth", block:"center"});
});

render();
renderQuiz();
</script>
