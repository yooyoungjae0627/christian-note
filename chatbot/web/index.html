<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>첫열매들 성경 해석 도우미</title>
<style>
  :root {
    --bg: #f6f3ec; --panel: #fffdf8; --ink: #2a2620; --muted: #766e62; --line: #e2dbcd;
    --accent: #2f5d50; --accent-ink: #fff; --me: #e4eee9; --warn: #a4442f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171614; --panel: #201f1c; --ink: #ece7dd; --muted: #a39b8d; --line: #35322d; --accent: #7fb7a4; --accent-ink: #10201b; --me: #24352f; --warn: #e08a73; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.65 "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
  }
  header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); background: var(--panel); padding-top: max(14px, env(safe-area-inset-top)); }
  header h1 { margin: 0; font-size: 17px; letter-spacing: -0.01em; }
  header p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
  main { flex: 1; overflow-y: auto; padding: 16px; scroll-behavior: smooth; }
  .wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 88%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-top-left-radius: 4px; }
  .msg.me { align-self: flex-end; background: var(--me); border-top-right-radius: 4px; }
  .msg.err { color: var(--warn); }
  .msg a { color: var(--accent); text-underline-offset: 2px; }
  .msg.wait { color: var(--muted); }
  .dots::after { content: ""; animation: dots 1.4s steps(4, end) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "·"; } 50% { content: "· ·"; } 75% { content: "· · ·"; } }
  @media (prefers-reduced-motion: reduce) { .dots::after { animation: none; content: "· · ·"; } main { scroll-behavior: auto; } }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; }
  .examples button { font: inherit; font-size: 14px; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  .examples button:hover { border-color: var(--accent); }
  form { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 16px; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  .row { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea, input { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  textarea { flex: 1; resize: none; max-height: 140px; min-height: 44px; }
  textarea:focus-visible, input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.send { font: inherit; font-weight: 600; min-height: 44px; padding: 0 18px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  button.send:disabled { opacity: .5; cursor: default; }
  .gate { display: flex; gap: 8px; margin-top: 8px; }
  .gate input { flex: 1; min-width: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>첫열매들 성경 해석 도우미</h1>
  <p>강의 자료에서 찾아 답하는 비공식 도우미 · AI가 정리한 답이니 링크의 강의 원문으로 확인해 주세요</p>
</header>
<main id="scroll">
  <div class="wrap" id="log" role="log" aria-live="polite">
    <div class="msg bot">성경 구절의 뜻이나 교리를 물어보시면 첫열매들 강의에서 찾아 강의 제목·시각 링크와 함께 답합니다.</div>
    <div class="examples" id="examples">
      <button type="button">징계와 가시는 어떻게 다른가요?</button>
      <button type="button">성령은 누구신가요?</button>
      <button type="button">두 복음은 무엇이 다른가요?</button>
    </div>
  </div>
</main>
<form id="form" autocomplete="off">
  <div class="row">
    <textarea id="q" rows="1" maxlength="1000" placeholder="질문을 적어 주세요" aria-label="질문"></textarea>
    <button class="send" id="send" type="submit">보내기</button>
  </div>
</form>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const log = $("log"), q = $("q"), sendBtn = $("send"), scroll = $("scroll");
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
  const sessionId = crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2, 12);
  let code = store.get("code") || "", busy = false;

  // 답은 글로만 넣는다(textContent). 주소만 골라 링크 요소로 만든다 — 서버 글을 HTML로 해석하지 않는다.
  function fill(el, text) {
    el.textContent = "";
    let last = 0;
    for (const m of text.matchAll(/https?:\/\/[^\s<>"')\]]+/g)) {
      el.append(text.slice(last, m.index));
      const a = document.createElement("a");
      a.href = m[0]; a.textContent = m[0]; a.target = "_blank"; a.rel = "noopener noreferrer";
      el.append(a);
      last = m.index + m[0].length;
    }
    el.append(text.slice(last));
  }
  function add(kind, text) {
    const el = document.createElement("div");
    el.className = "msg " + kind;
    fill(el, text);
    log.append(el);
    scroll.scrollTop = scroll.scrollHeight;
    return el;
  }
  function askCode(note) {
    const box = add("bot", note + "\n교회에서 받은 인증 번호를 넣어 주세요.");
    const row = document.createElement("div");
    row.className = "gate";
    const input = document.createElement("input");
    input.type = "password"; input.inputMode = "numeric"; input.setAttribute("aria-label", "인증 번호");
    const ok = document.createElement("button");
    ok.type = "button"; ok.className = "send"; ok.textContent = "확인";
    row.append(input, ok); box.append(row);
    return new Promise((resolve) => {
      const done = () => { if (!input.value.trim()) return; code = input.value.trim(); store.set("code", code); box.remove(); resolve(); };
      ok.addEventListener("click", done);
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); done(); } });
      input.focus();
    });
  }

  async function ask(text) {
    if (busy || !text.trim()) return;
    busy = true; sendBtn.disabled = true;
    $("examples")?.remove();
    add("me", text.trim());
    q.value = ""; q.style.height = "auto";
    const wait = add("bot wait", "강의 자료를 찾고 있습니다 ");
    const dots = document.createElement("span"); dots.className = "dots"; wait.append(dots);
    try {
      for (;;) {
        const res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text, sessionId, code }) });
        const body = await res.json().catch(() => ({}));
        if (res.status === 401) { await askCode(body.text || "인증 번호가 필요합니다."); continue; }
        wait.className = "msg bot" + (res.ok ? "" : " err");
        fill(wait, body.text || "답을 받지 못했습니다. 잠시 뒤에 다시 보내 주세요.");
        break;
      }
    } catch {
      wait.className = "msg bot err";
      fill(wait, "서버에 닿지 못했습니다. 연결을 확인하고 다시 보내 주세요.");
    }
    scroll.scrollTop = scroll.scrollHeight;
    busy = false; sendBtn.disabled = false; q.focus();
  }

  $("form").addEventListener("submit", (e) => { e.preventDefault(); ask(q.value); });
  q.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(q.value); } });
  q.addEventListener("input", () => { q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 140) + "px"; });
  $("examples").addEventListener("click", (e) => { if (e.target.tagName === "BUTTON") ask(e.target.textContent); });
})();
</script>
</body>
</html>
