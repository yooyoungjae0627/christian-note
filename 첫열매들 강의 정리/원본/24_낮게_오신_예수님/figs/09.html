<div class="slide">
  <div class="title">반전도 없다</div>
  <div class="verse">그는 사람들에게서 <span class="hl">멸시받고 거부되었으며</span>, 슬픔의 사람이요 질고에 익숙한 사람이라.</div>
  <div class="row">
    <div class="box r col"><div class="txt">"맞을 사람이 맞네"</div></div>
    <div class="box r col"><div class="txt">"벌 받을 사람이 벌 받네"</div></div>
    <div class="box r col"><div class="txt">"내려와 봐, 내려와 봐"</div></div>
  </div>
  <div class="mid">돌아가시는 순간까지 사람들 눈에 <span class="r">범죄자</span>로</div>
  <div class="txt">표적을 보여 줘도 안 믿는 이유 — <span class="y">이런 사람을 믿기가 싫은 거예요</span></div>
  <div class="src">이사야 53:3 · 한글KJV</div>
</div>
