<div class="slide">
  <div class="title">하나님의 시선</div>
  <div class="verse" style="text-align:left">…아이의 아버지가 울부짖으며<br>눈물로 말하기를 <span class="y">"주여, 내가 믿나이다.<br>나의 믿음 없음을 도와주소서."</span>라고 하더라.</div>
  <div class="verse" style="text-align:left">" '…그의 끈질긴 간청 때문에 그가 일어나서<br>그가 필요한 만큼 그에게 줄 것이라…구하라.<br>그리하면 그것이 너희에게 주어질 것이요.'…<br>하늘 아버지께서는 그분께<br>구하는 자들에게 <span class="y">거룩한 영을<br>얼마나 더 많이 주시겠느냐?"</span></div>
  <div class="src">마가복음 9:24 (한킹) / 누가복음 11:8-9, 13</div>
</div>
