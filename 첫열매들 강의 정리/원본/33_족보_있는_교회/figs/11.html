  <div class="verse" style="text-align:left">우리가 구원을 받게 해주는 믿음은<br>그렇다면 무엇인가? 그것은 <span class="gr">단순한 추론, 이성적 결과,<br>차갑고 생명이 없는 동의, 머릿속에 있는 훈련된 생각들</span>이<br>아니라, 마음의 상태이다. 그리스도의 복음 전체에 대한<br>단순한 동의가 아니라, <span class="y">그리스도의 피에 전적으로 의지하는 것이다;</span><br>그의 삶, 죽음, 부활의 효과를 믿는 것이다;<br>그를 우리의 대속제물과 생명으로서 믿고 의지하는 것이다.</div>
