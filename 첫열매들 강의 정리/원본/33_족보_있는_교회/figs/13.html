  <div class="title">감리교 · 존 웨슬리</div>
  <div class="verse" style="text-align:left">그가 그렇다는 보장을 그에게 주며, 그(Him)에 대한<br>어린아이 같은 자신감을 준다…<span class="y">보장은 자신감 전에 온다.</span><br>사람은 자신이 하나님의 자식이라는 것을 알기 전에는<br>하나님에 대한 아이같은 자신감을 가질 수 없다.<br>그러므로 자신감, 신뢰, 의지, 연합, 또는 그 무엇이든 간에<br>그것들은 사람들이 생각하는 것처럼 첫 번째가 아니요,<br>믿음에서 나오는 행위 혹은 가지로써 두 번째에 해당된다.</div>
  <div class="src">설교 43 「성경적 구원의 길」</div>
