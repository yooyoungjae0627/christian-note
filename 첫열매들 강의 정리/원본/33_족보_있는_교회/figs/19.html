<div class="slide">
  <div class="title">영생을 얻은 후에 잃어버릴 수 있는가?</div>
  <div class="row" style="align-items:stretch;gap:30px">
    <div class="box r col" style="width:560px;background:linear-gradient(180deg,rgba(255,90,40,.10),rgba(255,90,40,.35));justify-content:space-between">
      <div class="verse" style="font-size:30px">…형제들아…<br>우리의 몸은 순수한 물로 씻겨졌느니라…<br>우리가 진리의 지식을 받아들인 후에라도<br>우리가 고의적으로 죄를 짓는다면…<br>대적들을 집어삼킬 심판과<br>열화와 같은 격분을<br><span class="y">두렵게 기다리는 어떤 일만<br>남아 있느니라.</span></div><div class="sm">히브리서 10:19, 22, 26-27</div>
    </div>
    <div class="box b col" style="width:560px;background:linear-gradient(180deg,rgba(90,168,255,.35),rgba(90,168,255,.08));justify-content:space-between">
      <div class="verse" style="font-size:30px">음행이 너희 가운데 있음이<br>공공연하게 알려져 있는데…<br>누군가가 자신의 아버지의 아내를<br>취하였다는 것이라…<br>그러한 이를 육신의 멸망을 위해<br>사탄에게 넘겨주는 것은<br><span class="y">그 영이 주 예수의 날에<br>구원받게 하려 함</span>이라.</div><div class="sm">고린도전서 5:1, 5</div>
    </div>
  </div>
