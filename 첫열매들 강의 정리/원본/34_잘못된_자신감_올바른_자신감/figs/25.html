  <div class="title tg">올바른 자신감: <span class="tsub">부</span></div>
  <div class="verse" style="text-align:left"><p>내가 어려서부터 지금 늙기까지 <span class="g">의인</span>이 버림받거나<br>그의 씨가 <span class="r">걸식함</span>을 아직 <span class="g">보지 못하였도다</span>.</p><p class="gap">주께서는 <span class="g">의로운 자의 혼</span>이 <span class="r">굶주리는 것</span>을 <span class="g">용납하지 아니하시리라</span>…</p><p class="gap">…그분께서 그곳에 이 마이트를 던져 넣는 어떤 <span class="p">가난한 과부</span> 한 명도<br>보셨더라…“내가 너희에게 진실되이 말하노니, 이 <span class="p">가난한 과부</span>가<br>그들 <span class="B">모두보다 더 많이</span> 던져 넣었도다…그녀가 가진 <span class="g">생활비 전부</span>를<br>던져 넣은 것이기 때문이라.”</p></div>
