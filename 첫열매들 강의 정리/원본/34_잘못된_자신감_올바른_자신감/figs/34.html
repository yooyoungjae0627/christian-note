<div class="slide">
  <div class="title tg">올바른 자신감</div>
  <div class="verse" style="text-align:left"><p>…시몬이 그분께 대답하며 말씀드리기를,<br>“스승님, 우리가 밤새 <span class="k">애써</span> 일하였는데 아무것도 잡지 못하였나이다.<br>그럼에도 불구하고 <span class="g">당신의 말씀</span>에 따라 제가 <span class="g">그물을 내리겠나이다</span>.”…</p><p class="gap">너의 마음을 다하여 <span class="G">주</span><span class="g">를 신뢰</span>하라. 그리고 너 <span class="r">자신의</span> <span class="k">명철</span>에<br>기대지 말라. 너의 모든 길들 가운데서 <span class="G">그분</span><span class="g">을 인정하라</span>.<br>그리하면 그분께서 <span class="g">너의 행로들을 인도하시리라</span>.<br><span class="r">너 자신의 두 눈에</span> <span class="k">지혜</span><span class="r">롭게</span> 되지 말라. <span class="G">주</span><span class="g">를 두려워하고</span> 악에서 떠나라.</p></div>
  <div class="src">누가복음 5:5 / 잠언 3:5-7</div>
