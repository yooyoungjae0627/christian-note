  <div class="title tg">올바른 자신감</div>
  <div class="verse" style="text-align:left"><p>…너희가 말하기를, “오늘이나 내일 우리가 어느 한 도시 안으로<br>들어가서 일 년을 거기에 계속 있으며 사고팔고 <span class="k">이득을 얻으리라</span>.”<br>하는도다. 그러나 너희가 내일 일어날 일을 모르는도다…<br>너희는 마땅히 “만일 <span class="G">주께서 원하신다면</span> 우리가 살 것이요,<br>이것이나 저것을 하리라.” 하고 말하여야 하리라.<br>그러나 이제 너희는 너희의 <span class="k">자만</span>들을 크게 기뻐하는도다.<br>그러한 환희는 모두 악하니라.</p></div>
