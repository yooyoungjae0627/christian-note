  <div class="title"><span class="g">아버지 이름</span>으로 일하신 <span class="b">아들</span></div>
  <div class="verse">보라, 내가 한 <span class="b">천사</span>(<span class="b">mal’āk</span>)를 너의 앞으로 보내서 길에서 너를 보호하고<br>내가 예비한 장소 안으로 너를 데려가게 하리라.<br>그에게 주의를 기울이고 그의 음성에 순종하며 그를 격분시키지 말라.<br>이는 그가 너의 불법들을 면죄하지 아니할 것이기 때문이요,<br><span class="g">나의 이름</span>이 <span class="b">그 안에</span> 있기 때문이라.</div>
  <div class="verse">…저희에게 한 <span class="b">아들</span>이 주어지기 때문이니이다…<br>그분의 이름은 경이로우신 분이라, 조언자라, 막강하신 하나님이라,<br><span class="g">영원하신 아버지</span>라, 화평의 통치자라 불리리이다.</div>
  <div class="src">출애굽기 23:20-21 / 이사야 9:6</div>
