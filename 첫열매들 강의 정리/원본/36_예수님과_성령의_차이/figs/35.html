<div class="slide left" style="gap:28px">
  <div class="title"><span class="g">아버지의 뜻</span>과 구별되는 <span class="b">아들의 뜻</span></div>
  <div class="verse">…“<span class="g">아버지여</span>, 만일 당신께서 원하신다면 <span class="b">이 잔을 제게서 옮겨 주옵소서</span>.<br>그럼에도 불구하고 <span class="b">제 뜻</span>이 아니라<br>오직 <span class="g">당신의 뜻</span>이 이루어지기를 바라나이다.”…</div>
  <div class="verse">…모든 것을 이루시는 <span class="g">하나님</span>께서는 동일하시니라…<br>동일한 한 <span class="g">성령</span>께서 역사하시어 <span class="g">그분의 뜻</span>대로<br>모든 사람에게 저마다 개인별로 나누어 주시는 것이라.</div>
  <div class="verse">…마음들을 살피시는 분께서 <span class="g">성령의 생각</span>이 어떠한지를 아시나니,<br>그분께서 <span class="g">하나님의 뜻에 따라</span> 성도들을 위하여 <span class="g">중보</span>하시기 때문이라.</div>
  <div class="src">누가복음 22:42 / 고린도전서 12:6, 11 / 로마서 8:27</div>
