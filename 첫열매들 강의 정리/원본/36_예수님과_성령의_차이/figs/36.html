  <div class="title b">“순종”<span class="w">과</span> “의로움”</div>
  <div class="verse">그분께서는…스스로 이름 없이 되셨으며…<br><span class="p">사람과 같은 모양</span>으로 발견되신 그분께서는 스스로 겸손하시어 죽음,<br>곧 <span class="p">십자가의 죽음</span>에 이르기까지 <span class="hlb">순종</span>하셨느니라.</div>
  <div class="verse">그리스도께서도 죄들로 인하여 한 번 고난을 받으사<br><span class="b">의로운 자</span>로서 <span class="r">불의한 자</span>를 대신하셨으니…</div>
  <div class="src">빌립보서 2:6-8 / 베드로전서 3:18 (흠정역)</div>
