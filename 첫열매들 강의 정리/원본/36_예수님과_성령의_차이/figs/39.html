<div class="slide left" style="gap:30px">
  <div class="title"><span class="g">성령</span>과 <span class="g">아버지 하나님</span>의 소통</div>
  <div class="verse">…마음들을 살피시는 분께서 <span class="g">성령의 생각</span>(<span class="g">phronēma</span>)이<br>어떠한지를 아시나니, 그분께서 <span class="g">하나님의 뜻에 따라</span><br>성도들을 위하여 <span class="g">중보</span>하시기 때문이라.</div>
  <div class="verse">이는 내가 말할 내용으로 가득 차 있고,<br>내 안에 있는 <span class="g">영</span>이 <span class="b">나</span>를 강하게 <span class="g">압박</span>하기 때문이니이다…<br>내가 이야기하겠나니, 내가 시원해지고자 함이니이다…</div>
  <div class="verse"><span class="o">육신의 생각</span>(<span class="o">phronēma</span>)은 사망이요,<br><span class="g">영의 생각</span>(<span class="g">phronēma</span>)은 생명과 평안이니라.</div>
  <div class="src">로마서 8:27 / 욥기 32:18, 20 / 로마서 8:6 (개역개정)</div>
</div>
