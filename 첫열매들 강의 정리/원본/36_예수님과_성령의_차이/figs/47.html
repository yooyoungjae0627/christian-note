  <div class="mid" style="margin-top:50px">1. 출생 전 무존재</div>
  <div class="verse">“그는 낳아지기 전에, 곧 창조되기 전에,<br>규정되기 전에, 또는 세워지기 전에 <span class="u">존재하지 않았다.</span>”</div>
  <div class="rf">『아리우스가 니코메디아의 에우세비우스에게 보낸 편지 321-323』</div>
  <div class="mid">2. 아버지 하나님과 동격이 아니다.</div>
  <div class="verse">“그는 아버지와 같이 <span class="u">영원한 분도 아니고,</span><br><span class="u">아버지와 함께 영원한 분도 아니며</span>…”</div>
