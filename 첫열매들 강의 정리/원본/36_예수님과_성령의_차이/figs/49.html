  <div class="title" style="left:60px;right:auto">나지안조스의 그레고리오스 (330-390): <span style="font-weight:600">삼위일체 이론 토대 마련</span></div>
  <div class="verse" style="text-align:center;margin-top:50px">“…그렇다면 그는 <span class="b">어떻게 나셨는가?</span><br>나는 이 질문을 <span class="r">혐오감</span>을 담아 다시 입에 올린다.<br><span class="g">하나님</span>의 <span class="g">낳으심</span>에 대해서는<br>우리가 경외의 <span class="r">침묵으로 응답해야 마땅하다.</span>”</div>
  <div class="verse" style="text-align:center">“그러면 ‘<span class="b">나심</span>’이란 무엇인가?<br>네가 먼저 <span class="g">아버지</span>의 <span class="r">나시지 않음</span>을 설명해 보아라…<br><span class="r">하나님의 비밀</span>을 캐묻다가<br>우리 둘 다 <span class="r">함께 미쳐 버리자</span>.”</div>
  <div class="txt" style="font-weight:700">『신학 강론 29-8 / 31-8』</div>
</div>
