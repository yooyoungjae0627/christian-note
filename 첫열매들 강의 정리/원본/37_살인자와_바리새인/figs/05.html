<div class="slide left" style="justify-content:flex-start;padding-top:100px;gap:26px">
  <div class="title"><span class="y">구원의 복음에 관해</span></div>
  <div class="verse">…하나님께서 세상을 이처럼 사랑하셨기 때문에 그분께서<br>자신의 독생자를 주셨으니…<span class="y">영원한 생명</span>을 얻게 하려 하심이라.</div>
  <div class="verse">그분께서는 모든 사람들을 <span class="y">구원받게</span> 하기를 원하시고,<br>또 진리의 지식에 이르게 하기를 원하시느니라…<br>그분께서 모두를 위하여 하나의 <span class="y">속량 값으로 자신을 주셨으니</span>…</div>
  <div class="verse">…사람이 온 세상을 얻고도 자기 자신의 <span class="y">혼</span>을 <span class="r">잃는다면</span><br>그것이 그에게 무슨 유익이 있겠느냐?<br>혹은 사람이 자신의 <span class="y">혼</span>을 대신하여 무엇을 주겠느냐?</div>
  <div class="ln"></div>
  <div class="src">요한복음 3:16 / 디모데전서 2:4, 6 / 마가복음 8:36-37</div>
