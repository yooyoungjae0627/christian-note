  <div class="verse">… <span class="hy">바리새파</span> 사람들이 그들에게 대답하였더라. “너희도 속았느냐?…” <span class="p">니고데모</span>가 그들에게 이같이 말하니라…<span class="g">“우리의 율법이 당사자의 말을</span> <span class="g">듣고 그가 행하는 것을 알기 전에 그것이 아무 사람이나 판단하느냐?”</span> 그들이 그에게 대답하여 말하기를, <span class="p">“너도 갈릴리 출신이냐?…”</span></div>
