  <div class="title"><span class="r">더 많은 기회</span></div>
  <div class="verse">…그분의 <span class="g">막강한 역사들</span>의 대부분이 행해진 도시들을 그분께서 질책하기 시작하셨으니, 그들이 <span class="r">회개하지 않았기 때문</span>이라… “하늘까지 크게 높여진 <span class="r">가버나움</span>아, 네가 <span class="r">지옥</span>까지 끌어내려지리라. 이는 만일 네 안에서 행해진 그 <span class="g">막강한 역사들</span>이 <span class="p">소돔</span>에서 행해졌더라면 그곳은 오늘날까지 남아 있었을 것이기 때문이라… ‘심판의 날에 <span class="p">소돔</span> 지역이 너보다는 더 버티기 쉬우리라.’”</div>
  <div class="src">마태복음 11:20, 23-24</div>
