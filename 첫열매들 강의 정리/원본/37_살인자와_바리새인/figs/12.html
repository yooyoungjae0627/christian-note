<div class="slide left" style="justify-content:flex-start;padding-top:100px;gap:26px">
  <div class="title"><span class="r">용서 받지 못할 죄</span></div>
  <div class="verse">이는 그들이 <span class="y">의의 길을 알고 난 뒤</span>에 자신들에게<br>전달된 <span class="y">거룩한 명령</span>에서 <span class="r">돌아서는 것</span>보다는 <span class="p">의의 길을 몰랐던 쪽</span>이<br>그들에게 더 나았을 것이기 때문이라.</div>
  <div class="verse">하나님의 <span class="b">선한 말씀</span>과 다가올 세상의 <span class="g">권능들</span>을 <span class="y">맛보았던 자들</span>,<br>바로 그들이 만일 <span class="r">떨어져 나가면</span> 그들을 다시 <span class="g">회개</span>에 이르도록<br>새롭게 하는 것이 <span class="r">불가능</span>하기 때문이니…하나님의 아들을 새로이<br>십자가에 못 박아서 그분을 노골적으로 수치스럽게 했기 때문이라.</div>
  <div class="ln"></div>
  <div class="src">베드로후서 2:21 / 히브리서 6:5-6</div>
