<div class="slide left" style="gap:30px">
  <div class="title"><span class="r">고의적인 죄</span></div>
  <div class="verse">…만일 우리가 <span class="y">진리의 지식을 받아들인 후</span>에라도 우리가 <span class="rb">고의적으로</span>(<span class="gk">hekousiōs</span>) <span class="r">죄를 짓는다면</span> 죄들로 인한 희생 제물이 더 이상 남아 있지 않기 때문이라. 다만 대적들을 집어삼킬 <span class="r">심판과 열화와 같은 격분</span>을 두렵게 기다리는 어떤 일만 남아 있느니라… 하물며 <span class="y">하나님의 아들</span>을 발아래 짓밟고, 자신이 그것으로 성결하게 구별된 그 <span class="y">언약의 피</span>를 거룩하지 않은 것으로 여겨 <span class="y">은혜의 영</span>을 <span class="r">모독</span>한 자에게는 얼마나 더 <span class="r">심한 형벌</span>이 합당하다고 여겨지겠는가?…</div>
  <div class="src">히브리서 10:26-27, 29 / 베드로전서 5:2</div>
