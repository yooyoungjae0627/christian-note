<div class="slide left" style="justify-content:flex-start;padding-top:100px;gap:26px">
  <div class="title"><span class="r">고의적인 죄</span></div>
  <div class="verse">“네가 주의 이름으로 우리에게 전한 그 <span class="y">말씀</span>으로 말하자면,<br>우리는 너에게 <span class="r">경청하지 아니하겠노라</span>.”</div>
  <div class="verse">…“오직 우리는 <span class="r">우리 자신의 계책들을 따라 살아가겠노라</span>. 그리고<br>우리는 모두 저마다 <span class="r">자신의 악한 마음의 상상을 실행하겠노라</span>.” 하였도다.</div>
  <div class="verse">“ ‘…그 <span class="y">혼</span>이 조금이라도 <span class="r">주제넘게 행한다면</span>, 바로 그 <span class="y">혼</span>은 <span class="r">주를 모욕</span>하는<br>것이라. 그런즉 그 <span class="y">혼</span>은 자기 백성 가운데서 <span class="r">끊어지리라</span>.<br>이는 그가 <span class="y">주의 말씀</span>을 <span class="r">멸시</span>하였고 <span class="y">그분의 명령</span>을 <span class="r">어긴 까닭</span>에…’ ”</div>
