  <div class="title"><span class="r">고의적인 죄</span></div>
  <div class="verse">“네가 주의 이름으로 우리에게 전한 그 <span class="y">말씀</span>으로 말하자면, 우리는 너에게 <span class="r">경청하지 아니하겠노라</span>.”</div>
