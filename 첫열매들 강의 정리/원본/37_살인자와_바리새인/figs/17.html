  <div class="title"><span class="gb">선생의 책임</span></div>
  <div class="verse">이는 시간상 너희가 마땅히 <span class="gb">선생들</span>이 되어야 할 때인데…</div>
  <div class="verse">나의 형제들아, 많은 <span class="gb">스승들</span>이 되지 말라.<br>이는 우리가 <span class="r">더 큰 정죄</span>를 받을 것을 알고 있기 때문이라.</div>
  <div class="verse">너희 자신들 가운데서도 제자들을 끌어내어 <span class="hy">자기들을 좇게 하려고</span><br>비뚤어진 것들을 말하는 사람들이 일어나리라.</div>
