  <div class="title"><span class="hy">최악의 죄</span></div>
  <div class="verse">‘모든 죄들은 사람들의 아들들에게 용서될 것이요… 그러나 <span class="hy">성령을 대적</span>하여 신성 모독하는 자는 결단코 <span class="r">용서받지 못할 것</span>이요, 오히려 <span class="r">영존하는 형벌의 심판</span>의 위험에 처하느니라.’ ”이는 그들이 말하기를, “<span class="hy">그는 한 불결한 영을 지녔도다</span>.” 하였기 때문이라.</div>
