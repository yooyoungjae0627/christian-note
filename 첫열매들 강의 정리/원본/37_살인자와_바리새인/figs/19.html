<div class="slide left" style="gap:30px">
  <div class="title"><span class="hy">잘못된 복음</span></div>
  <div class="verse">…위선자들인 <span class="hy">서기관</span>들과 <span class="hy">바리새파</span> 사람들아, 너희에게 화가 있기를 바라노라! 이는 사람들을 거슬러 <span class="y">하늘의 왕국</span>을 너희가 <span class="r">닫아 버렸으므로</span> 너희가 스스로 들어가지도 않고 <span class="y">들어가려고 진입하는 자들</span>도 너희가 <span class="r">용납하지 않기 때문</span>이라…</div>
  <div class="verse">이는 너희가 한 명의 <span class="y">개종자</span>를 만들기 위해 바다와 육지를 순회하다가 그가 <span class="y">개종자</span>가 되면, 너희는 그를 자신들보다 두 배나 더한 <span class="r">지옥의 자식</span>으로 만들기 때문이라.</div>
