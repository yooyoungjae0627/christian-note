<div class="slide left" style="justify-content:flex-start;padding-top:100px;gap:26px">
  <div class="title"><span class="r">악한 죄</span>를 짓기 전에</div>
  <div class="verse">형제들아, 주의하여 너희 중 누구도 <span class="p">불신의 악한 마음</span>을 지녀<br>살아 계신 <span class="p">하나님으로부터 떠나지</span> 않도록 하라.<br>다만 오늘이라고 불리는 동안 <span class="g">매일 서로 권면</span>하여 너희 중 누구도<br>죄의 가득한 속임수를 통하여 <span class="r">완악</span>해지지 않도록 하라.</div>
  <div class="verse">자주 <span class="p">책망</span>을 받으면서도 자신의 <span class="r">고개를 꼿꼿하게</span> 하는 자는<br>갑작스럽게 <span class="r">멸망</span>하리니, <span class="r">치유책이 없으리라</span>.</div>
  <div class="ln"></div>
  <div class="src">히브리서 3:12-13 / 잠언 29:1</div>
