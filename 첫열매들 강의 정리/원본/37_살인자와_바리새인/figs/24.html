<div class="slide left" style="justify-content:flex-start;padding-top:100px;gap:26px">
  <div class="title"><span class="r">악한 죄</span></div>
  <div class="verse">그들은 <span class="hy">위선</span>으로 <span class="hy">거짓말들을 전하니</span>,<br>자신들의 <span class="g">양심</span>을 <span class="r">뜨거운 인두로 지져지게</span> 하였도다.</div>
  <div class="verse">… <span class="hy">더럽혀진 자들과 믿지 않는 자들</span>에게는 아무것도 순수하지 않고<br>오히려 그들의 생각과 <span class="g">양심</span>까지 <span class="r">더럽혀지느니라</span>.</div>
  <div class="verse">그러나 너희가 그 <span class="y">형제</span>에게 그렇게 죄를 짓고 그들의 <span class="g">약한 양심</span>에<br><span class="r">상처를 입힐 때</span> 너희는 <span class="r">그리스도를 대적하여 죄를 짓는 것</span>이라.</div>
  <div class="ln"></div>
  <div class="src">디모데전서 4:2 / 디도서 1:15 / 고린도전서 8:12</div>
