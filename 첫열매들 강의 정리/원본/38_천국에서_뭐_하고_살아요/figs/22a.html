  <div class="title"><span class="W">새 예루살렘</span></div>
  <div class="verse"><p>…“어린양의 아내인 <span class="W">신부</span>를 보여 주겠노라.” 하였더라… 거룩한 <span class="W">예루살렘</span>을 나에게 보여 주었는데…그녀의 <span class="W">빛</span>은 지극히 보배로운 <span class="W">보석</span>과도 같았으니…도성을 측량하였더니 일만 이천 펄롱(2,200km)이라. 그것의 길이와 너비와 높이가 같았더라…성벽의 건축물이 <span class="W">벽옥</span>으로 되었고 그 도성은 <span class="W">순금</span>이었으며 맑은 유리 같았더라…첫째 기초는 <span class="W">벽옥</span>이었고, 둘째는 <span class="W">사파이어</span>, 셋째는 <span class="W">옥수</span>, 넷째는 <span class="W">에메랄드</span>… 열두 대문들은 열두 <span class="W">진주</span>들이었으며…도성의 거리는 <span class="W">순금</span>이었으니…</p></div>
  <div class="src">요한계시록 21:9-11, 16, 18-19, 21 / 22:2</div>
