  <div class="verse" style="text-align:center">오 주여, 주께서 하시는 일들이 얼마나 <span class="bk">다양</span>한지요! 주께서 그들 모두를<br>지혜로 지으셨으니 땅이 주의 풍요로 가득 찼나이다.<br>이 크고 넓은 바다가 그러하오며 그 속에 기어다니는 것들,<br>즉 크고 작은 짐승들은 셀 수가 없나이다.</div>
  <div class="src">시편 104:24-25 (한킹)</div>
