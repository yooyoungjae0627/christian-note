  <div class="title">인간이 생각하는 <span class="pk">정의</span></div>
  <div class="verse">…이 세 사람이 욥에게 대답하기를 중단하였으니, 그가 자기 자신의<br>두 눈에 <span class="pk">의로웠기</span> 때문이라…엘리후의 격노가 타올랐더라…<br>그가 하나님보다 자신을 더 <span class="pk">정당화</span>하였기 때문이라…“나는 당신의<br>말들의 음성을 들었나니…‘나는 불법과 무관하며 <span class="pk">정결</span>하도다…또한 내<br>안에는 <span class="pk">죄악이 없도다</span> …그분께서 나를 그분의 원수로 여기시는도다…</div>
