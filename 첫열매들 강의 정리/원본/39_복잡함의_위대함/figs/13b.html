  <div class="title">인간이 생각하는 <span class="pk">정의</span></div>
  <div class="verse">보소서, 이 점에서 당신은 정의롭지 아니하나이다.<br>내가 당신에게 답하겠나니, 하나님께서는 사람보다 더 <span class="bk">위대하시나이다</span>…<br>나는 당신의 <span class="bk">정당함</span>을 입증하기를(<b>justify</b> you) 열망하기 때문이니이다.<br>…나에게 경청하소서. 당신의 침묵을 지키소서.<br>그리하면 내가 당신에게 <span class="bk">지혜</span>를 가르치리이다.”</div>
