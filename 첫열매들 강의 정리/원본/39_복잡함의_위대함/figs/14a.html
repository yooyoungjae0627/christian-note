  <div class="title">자연을 통해 증명되는 하나님의 <span class="bk">정의</span></div>
  <div class="verse"><span class="bk">하늘들</span>을 바라보고 또 살펴보소서… <span class="bk">구름들</span>을 보소서.<br>설령 당신이 죄를 짓는다 한들, 그분을 대적하여 당신이 무엇을 하는<br>것이니이까?…보소서, 하나님께서는 <span class="bk">위대하시고</span> 우리는 그분을<br>모르나이다…이는 그분께서 <span class="bk">작은 물방울</span>들을 만드시기 때문이니이다.<br>그것들은 <span class="bk">물방울</span>들로 이루어진 <span class="bk">수증기</span>에 따라 <span class="bk">비</span>를 아래로 쏟나이다…</div>
