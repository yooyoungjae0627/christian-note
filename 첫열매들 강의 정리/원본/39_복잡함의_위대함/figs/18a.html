  <div class="title">자연을 통해 증명되는 하나님의 <span class="bk">정의</span></div>
  <div class="verse">그때 욥이 주께 대답하여 이같이 말씀드렸더라.<br>“보소서, 저는 비천하나이다. 제가 당신께 무엇을 답하겠나이까?<br>제가 저의 손을 저의 입에 올리겠나이다. 한 번 제가 말하였나이다…<br>두 번 말하였으나 제가 여기서 더 말을 잇지 아니하겠나이다.”</div>
  <div class="src">욥기 40:3-6, 8-9, 14</div>
