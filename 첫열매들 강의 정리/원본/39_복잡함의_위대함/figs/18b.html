  <div class="title">자연을 통해 증명되는 하나님의 <span class="bk">정의</span></div>
  <div class="verse">그때 주께서 <span class="bk">회오리바람</span> 속에서…이같이 말씀하셨느니라…<br>너는 또한 나의 <span class="bk">공의</span>를 무효화하겠느냐?<br>너는 스스로 <span class="pk">의로워지려고</span> 나를 정죄하겠느냐?<br>너는 하나님 같은 팔을 가지고 있느냐? 아니면 네가 그분과 같은 음성으로<br><span class="bk">천둥소리</span>를 낼 수 있겠느냐?…그때는 나도 너 <span class="pk">자신의 오른손</span>이<br>너를 구원할 수 있다는 것을 너에게 시인하겠노라.</div>
