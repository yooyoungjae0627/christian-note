  <div class="title">자연을 통해 증명되는 하나님의 <span class="bk">정의</span></div>
  <div class="verse"><span class="o">놋</span>을 썩은 목재같이 여기느니라. <span class="o">화살</span>은 그를 도망하게 할 수 없느니라…<br><span class="o">투창</span>들은 그루터기로 여겨지느니라. <span class="o">창</span>을 흔드는 것도 그가 비웃는도다…<br>그가 깊음을 냄비처럼 끓게 만드는도다…그가 자기 뒤에 행로를<br>빛나게 만드나니, 누군가 깊음을 백색이라고 생각할 것이라.<br>땅 위에는 그와 같은 것이 없나니, 그는 <span class="bk">두려움 없이</span> 지음을 받았느니라.</div>
  <div class="src">욥기 41:1, 6-7, 9, 26-29, 31-33</div>
