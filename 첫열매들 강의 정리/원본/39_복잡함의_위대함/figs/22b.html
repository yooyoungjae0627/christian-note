  <div class="title">자연을 통해 증명되는 하나님의 <span class="bk">정의</span></div>
  <div class="verse">제가 당신께 여쭙겠나이다. 그리하면 당신께서 제게 분명히 밝혀<br>주시옵소서. 제가 <span class="pk">귀로 듣는 것을 통하여</span> 당신에 관하여 들어 왔나이다.<br>그러나 이제 <span class="bk">제 눈이 당신을 보나이다</span>. 이러한 이유로 제가 제 자신을<br>혐오하고 티끌과 재들 속에서 회개하나이다.”…<br>그렇게 하여 주께서 욥의 초기보다 그의 나중 결말에 더 <span class="bk">복</span>을 주셨더라…</div>
  <div class="src">욥기 42:1-6, 12</div>
