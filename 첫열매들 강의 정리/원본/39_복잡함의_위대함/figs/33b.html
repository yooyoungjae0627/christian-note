  <div class="title"><span class="bk">복잡함의 위대함</span></div>
  <div class="verse">오, 깊도다, 하나님의 지혜와 <span class="bk">하나님의 지식</span> 모두의 <span class="bk">부요</span>하심이여!<br>과연 그분의 판단들은 <span class="bk">헤아릴 수 없으며</span>,<br>그분의 지나간 길들은 <span class="bk">찾아낼 수 없도다</span>!<br>그러므로 누가 주의 생각을 알았느냐?<br>아니면 누가 그분의 조언자가 되었느냐?</div>
  <div class="src">로마서 11:25-26, 33-34</div>
