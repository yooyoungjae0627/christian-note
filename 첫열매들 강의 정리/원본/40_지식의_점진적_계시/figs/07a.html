  <div class="title"><span class="g">아버지의 이름으로</span></div>
  <div class="verse">보라, 내가 한 <span class="b">천사(mal’āk)</span>를 너의 앞으로 보내서 길에서 너를 보호하고<br>내가 예비한 장소 안으로 너를 데려가게 하리라.<br>그에게 주의를 기울이고 그의 음성에 순종하며 그를 격분시키지 말라.<br>이는 그가 너의 불법들을 면죄하지 아니할 것이기 때문이요,<br><span class="g">나의 이름</span>이 <span class="b">그 안에</span> 있기 때문이라.</div>
