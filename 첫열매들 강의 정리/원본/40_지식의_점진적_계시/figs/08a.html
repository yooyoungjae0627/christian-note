  <div class="title"><span class="g">아버지</span>와 <span class="b">아들</span>을 구분하는 방법</div>
  <div class="verse">어떤 사람도 <span class="g">아버지</span>를 <span class="r">보지 못하였으나</span><br><span class="b">하나님께로부터 난 자</span>는 <span class="r">예외</span>이니, 그는 <span class="g">아버지</span>를 <span class="r">보았느니라</span>.<br>&nbsp;<br>시작부터 계셨던 그것, 곧 우리가 <span class="o">들었고</span><br>우리가 우리의 <span class="o">눈</span>으로 <span class="o">목격</span>하였으며 우리가 눈여겨보았고<br>우리의 <span class="o">손</span>이 <span class="o">만져 보았</span>던 생명의 <span class="o">말씀</span>에 관해서라.</div>
  <div class="src">요한복음 6:46 / 요한일서 1:1-3</div>
