  <div class="title"><span class="hb">비밀</span><span class="b">인 예수님 이름</span></div>
  <div class="verse">…마노아가 주의 <span class="b">천사(mal’āk)</span>에게 말하기를,<br>“당신의 이름이 무엇이니이까?”…그러자 주의 천사가 그에게 말하기를,<br>“그것이 <span class="hb">비밀</span>인 것을 알면서 어찌하여 네가 나의 이름을 이같이 묻느냐?”<br>하였더라…그리하여 마노아가 그의 아내에게 말하기를,<br>“우리가 <span class="b">하나님</span>을 보았으니, 우리는 반드시 죽으리라.” 하였더라.</div>
  <div class="src">사사기 13:17-18, 22 / 잠언 30:4</div>
