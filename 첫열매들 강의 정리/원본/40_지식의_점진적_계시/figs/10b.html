  <div class="title"><span class="g">엠마누엘</span> ➡ <span class="b">예수</span></div>
  <div class="verse">이제 예언자를 통하여 주에 관해 언급된 것이 성취되게 하려고<br>이 모든 일이 이루어졌으니 말씀하시기를,<br>“보라, 한 처녀가 아이를 잉태하여 한 아들을 낳으리니,<br>그들이 그의 이름을 <span class="g">엠마누엘</span>이라 부르리라.” 하신 것이라.<br>그것은, ‘<span class="g">우리와 함께 계시는 하나님</span>’이라고 해석되느니라.</div>
  <div class="src">마태복음 1:21-23</div>
