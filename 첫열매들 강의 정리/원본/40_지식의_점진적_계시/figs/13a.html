  <div class="title"><span class="b">예수 이름을 </span><span class="hb">비밀</span><span class="b">로 한 이유</span></div>
  <div class="verse">…베드로가 대답하여 말씀드리기를, “당신께서는 <span class="b">그리스도</span>시요,<br>살아 계신 하나님의 아들이시니이다.” 하였더라…그때 이후부터<br><span class="b">예수</span>님께서 자기 제자들에게 보여 주기 시작하신 것은…자신이…<br><span class="r">죽임</span>당하여야 한다는 것과 셋째 날에 다시 일으켜져야 한다는<br>것이었더라. 그때 베드로가 그분을 잡고서 그분을 꾸짖기 시작하며<br>말씀드리기를, “<span class="r">주여</span>, <span class="r">그것이 당신께 결코 일어나지 않기를 바라나이다.</span><br><span class="r">이 일이 당신께 일어나서는 아니 되나이다</span>.” 하였더라.</div>
  <div class="src">마태복음 16:16, 21-22 / 요한복음 16:12</div>
