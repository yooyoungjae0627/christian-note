  <div class="title">자연을 통해 증명되는 하나님의 <span class="bk">정의</span></div>
  <div class="verse">너는 그 <span class="bk">말</span>에게 힘을 준 적이 있느냐?…<br>너는 그를 풀무치같이 무섭게 만들 수 있느냐?…<br>너의 지혜로 <span class="bk">매</span>가 날며 그녀의 날개들을 남쪽을 향하여 뻗느냐?<br>너의 명령에 <span class="bk">독수리</span>가 상승하고 그녀의 둥지를 높은 곳에 만드느냐?<br>그녀는 바위 위와 바위의 벼랑과 튼튼한 처소 위에 머물며 거하는도다.</div>
  <div class="src">욥기 39:1-2, 19-20, 26-28</div>
