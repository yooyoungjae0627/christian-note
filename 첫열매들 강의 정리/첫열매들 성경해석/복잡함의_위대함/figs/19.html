  <div class="title">자연을 통해 증명되는 하나님의 <span class="bk">정의</span></div>
  <div class="verse">이제, 너와 마찬가지로 내가 만든 <span class="bk">베헤못</span>을 보라.<br>그는 소같이 풀을 먹느니라…<br>그는 자신의 <span class="bk">꼬리를 백향목처럼</span> 움직이느니라…<br>그의 <span class="bk">뼈들은 철 빗장들</span>과도 같으니라.<br>그는 하나님의 길들에서 단연 으뜸이라…그가 <span class="bk">강을 마셔 버리나니</span>…<br>그는 자신이 요르단을 그의 입안으로 다 빨아들일 수 있다고<br>확신하는도다.</div>
  <div class="src">욥기 40:15, 17-19, 23</div>
