  <div class="title"><span class="bk">하나님의 계산</span></div>
  <div class="verse">…하늘의 왕국은 먼 나라로 여행하면서 자기 자신의 종들을 불러<br>그들에게 자신의 소유물들을 넘겨준 남자와 같으니라.<br>그런데 그가 한 명에게는 <span class="pk">오 달란트</span>를, 또 다른 이에게는 <span class="pk">이 달란트</span>를,<br>또 다른 이에게는 <span class="pk">일 달란트</span>를 주었으니,<br>각 사람에게 그의 개별적인 재능에 따라 주었더라…<br>오랜 시간 뒤에 그 종들의 소유주가 와서 그들과 <span class="bk">계산</span>하니라.</div>
  <div class="src">마태복음 25:14-15, 19</div>
</div>
