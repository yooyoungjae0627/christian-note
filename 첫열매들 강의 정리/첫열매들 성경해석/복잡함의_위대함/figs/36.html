  <div class="title"><span class="bk">하나님에 대한 신뢰</span></div>
  <div class="verse">그때 뒤돌아본 베드로가 예수님께서 <span class="pk">사랑하신 제자</span>가 따라오는 것을<br>보니라…베드로가 그를 보면서 예수님께 말씀드리기를,<br>“주여, 그리하면 <span class="pk">이 사람은 무엇을 하리이까</span>?” 하니라.<br>예수님께서 그에게 말씀하시기를, “설령 내가 그를 내가 올 때까지<br>머물게 할지라도 그것이 <span class="bk">너와 무슨 상관이냐</span>? 너는 나를 따르라.”<br>하시니라.</div>
  <div class="src">요한복음 21:20-22</div>
