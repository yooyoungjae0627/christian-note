<div class="slide left" style="gap:30px">
  <div class="title"><span class="p">죄의 경중</span></div>
  <div class="verse">누구든 자기 형제가 <span class="p">사망에 이르지 않는 죄</span>를 짓는 것을 본다면 그는 하나님께 구할지니, 그리하면 그분께서 <span class="p">사망에 이르지 않는 죄</span>를 지은 자들을 위하여 그에게 <span class="y">생명</span>을 주시리라. <span class="r">사망에 이르는 죄</span>가 있으나 나는 그가 그것을 위하여 기도해야 한다고 말하지 아니하노라. 모든 <span class="r">불의</span>가 <span class="r">죄</span>니라. 그런데 <span class="p">사망에 이르지 아니하는 죄</span>가 있느니라.</div>
  <div class="src">요한일서 5:16-17</div>
</div>
