<div class="slide left" style="gap:30px">
  <div class="title"><span class="y">회개와 용서</span></div>
  <div class="verse">…만일 <span class="p">사악한 자</span>가 자신이 저지른 <span class="p">자신의 모든 죄들</span>에서 <span class="g">돌이키고</span>… <span class="g">올바른 일</span>을 행하는 경우, 그는 <span class="y">반드시 살리니</span>, 그는 <span class="y">죽지 아니하리라</span>. 그가 저지른 <span class="p">그의 모든 불법들</span>, 그것들은 그에게 <span class="y">언급되지 아니하리라</span>. 그는 자신이 행한 자기 <span class="y">의 가운데서 살리라</span>. 내가 <span class="p">사악한 자</span>가 죽어야 하는 것을 조금이라도 기뻐하랴?… 그가 자기 길들에서 <span class="y">돌이켜서 사는 것</span>을 기뻐하지 아니하랴?</div>
  <div class="src">에스겔 18:21-23 / 열왕기상 14:8</div>
