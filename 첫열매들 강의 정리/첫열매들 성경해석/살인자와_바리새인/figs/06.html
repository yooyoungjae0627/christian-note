  <div class="title"><span class="b">의도</span>가 행위를 규정</div>
  <div class="verse">…그때가 되기 전, 곧 주께서 오실 때까지는 아무것도 <span class="p">판단</span>하지 말라. 그분께서는 어둠의 감추어진 일들을 <span class="y">빛</span>으로 가져오기도 하실 것이며, <span class="b">마음들 속의 의도들</span>을 명백하게 나타내기도 하실 것이라. 그런 다음에야 비로소 모든 사람이 저마다 하나님께로부터 <span class="y">칭찬</span>을 받을 것이라.</div>
  <div class="src">고린도전서 4:5</div>
