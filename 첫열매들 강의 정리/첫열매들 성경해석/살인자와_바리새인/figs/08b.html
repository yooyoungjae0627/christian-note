  <div class="title"><span class="g">죄를 짓기 원하지 않음</span></div>
  <div class="verse">…최고 치리자들 사이에서도 많은 이들이 그분을 <span class="g">믿었더라</span>. 그러나 <span class="hy">바리새파</span> 사람들 때문에 그들은 그분을 <span class="p">시인하지 못하였으니</span>, 자신들이 회당에서 <span class="p">출회되지 않으려 함</span>이었더라. 이는 그들이 사람들의 찬사를 하나님의 찬사보다 더 사랑하였기 때문이라.</div>
