<div class="slide left" style="gap:30px">
  <div class="title"><span class="p">죄를</span> <span class="r">유도하는 죄</span></div>
  <div class="verse">예수님께서 대답하시기를, “그것이 위에서부터 너(<span class="pi">빌라도</span>)에게 주어지지 아니하였더라면 너는 나를 대적할 어떤 권세도 가질 수 없었으리라. 그러므로 나를 <span class="r">너에게 넘겨준 자</span>(<span class="ri">바리새인</span>)에게는 더 <span class="r">크나큰 죄</span>가 있도다.” 하셨느니라.</div>
  <div class="verse">…누구라도 나를 믿는 이 <span class="y">어린이들</span> 중 한 명을 <span class="r">실족시키는</span> 자는 그의 <span class="r">목 주위에 연자 맷돌 한 짝이 걸린 채</span> 그가 <span class="r">바다 깊은 곳에 빠져 죽게</span> 되는 것이 그에게 더 나으니라.</div>
  <div class="src">요한복음 19:11 / 마태복음 18:6</div>
</div>
