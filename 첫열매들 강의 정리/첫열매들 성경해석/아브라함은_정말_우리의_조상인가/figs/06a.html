  <div class="verse">그리고 <span class="h">아브람</span>이 그 지역을 통과하여 <span class="y">시켐</span>이라는 곳으로 들어가서<br><span class="y">모레의 평야</span>까지 이르렀더라…주께서 <span class="h">아브람</span>에게 나타나시어 말씀하시기를,<br>“내가 <span class="y">이 지역</span>을 너의 씨에게 주겠노라.” 하셨느니라…</div>
