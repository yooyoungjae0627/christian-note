  <div class="title"><span class="y">유대인의 조상 아브라함</span></div>
  <div class="verse">그리고 롯이 <span class="h">아브람</span>에게서 분리된 후에 주께서 <span class="h">아브람</span>에게 이같이<br>말씀하셨느니라. “이제 너의 두 눈을 들어 <span class="y">네가 있는 곳</span>에서 북쪽과 남쪽과<br>동쪽과 서쪽을 바라보라. 이는 내가 너에게 그리고 너의 씨에게<br><span class="y">네가 보고 있는 모든 지역</span>, 곧 그곳을 <span class="g">영원히 줄 것</span>이기 때문이라.</div>
