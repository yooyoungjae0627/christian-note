  <div class="title"><span class="y">아브라함</span>이 받는 <span class="g">유산</span></div>
  <div class="verse">그리고 “다시 한 번 더”라는 이 말씀은 흔들릴 수 없는 그러한 것들이<br>남아 있게 하시려고 <span class="g">흔들리는 그러한 것들</span>,<br>곧 현재 만들어져 있는 것들을 <span class="g">제거하심</span>을 알려 주시려는 것이라.<br>이런 이유로 우리가 <span class="g">흔들리지 않는 한 왕국</span>을 받았으니…</div>
  <div class="src">히브리서 12:22, 26-28</div>
