  <div class="title"><span class="y">아브라함</span>의 <span class="b">믿음</span></div>
  <div class="verse">“너희의 조상 <span class="h">아브라함</span>은 <span class="b">나의 날</span>을 보는 것을 <span class="y">크게 기뻐하였느니라</span>.<br>그리하여 그가 그것을 <span class="y">보았고 반가워하였느니라</span>.”<br>…<span class="h">아브라함</span>은 그분께서 친히 약속하신 것을 또한 능히 완수할 수 있으시다고<br><span class="b">완전히 확신</span>하게 되었으니, 그러므로 그 <span class="b">믿음</span>이 그에게 <span class="y">의</span>로 전가되었느니라.</div>
