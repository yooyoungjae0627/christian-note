  <div class="title"><span class="y">아브라함의 구원</span></div>
  <div class="verse">이는 그로 하여금 <span class="o">믿는 자들 모두의 조상</span>이 되도록 하셨으니…<br>또한 <span class="y">할례의 조상</span>이 되도록 하셨으니 할례에 속한 자들에게뿐만 아니라 아직<br>우리 조상 아브라함이 <span class="o">할례받지 않았을 때 소유한</span> 그 <span class="b">믿음</span>의 발걸음들을 따라<br>살아가는 자들에게도 그러하니라.</div>
