<div class="slide left">
  <div class="title b">생명체의 정의 = 혼</div>
  <div class="verse">…내가 너희 앞에 <span class="y">생명</span>과 <span class="r">죽음</span>, <span class="y">복</span>과 <span class="r">저주</span>를 놓아 두었느니라.<br>그러므로 <span class="y">생명</span>을 <span class="b">선택</span>하여 너와 너의 씨 모두가 살 수 있게 하라.</div>
  <div class="verse">그리고 하나님께서 말씀하시기를,<br>“물들은 <span class="b">생명이 있고</span> 움직이는 <span class="b">창조물</span>(nephesh)과,<br>하늘의 펼쳐진 궁창에서 땅 위를 날아다닐 수 있는 날<span class="b">짐승</span>을<br>풍부하게 내라.” 하셨느니라.</div>
  <div class="src">신명기 30:19 / 창세기 1:20</div>
</div>
