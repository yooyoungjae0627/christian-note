  <div class="title g">영적 존재</div>
  <div class="verse"><span class="g">하나님</span>은 <span class="g">영</span>이시니 그분께 경배하는 자들이 반드시 영과 진리로 그분께<br>경배할지니라, 하시니라.</div>
  <div class="verse"><span class="g">천사들</span>은 모두 구원의 상속인들이 될 자들을 위하여 섬기도록 보냄을<br>받은 섬기는 <span class="g">영</span>들이 아니냐?</div>
  <div class="verse">…하나님께서 <span class="r">죄지은</span> <span class="g">천사들</span>을…지옥에 던져 버리시며,<br>그들을 어둠의 사슬들에 넘겨주시어 <span class="r">심판</span> 때까지 간직되게 하셨을진대,</div>
  <div class="verse">“…<span class="g">영</span>은 <span class="o">살과 뼈</span>들을 지니고 있지 않지만…나는 지니고 있기 때문이라.”</div>
  <div class="src">요한복음 4:24 (흠정역) / 히브리서 1:14 / 베드로후서 2:4 / 누가복음 24:39</div>
