<div class="slide left" style="gap:30px">
  <div class="title b">예수 이름을 <span class="hlb">비밀</span>로 한 이유</div>
  <div class="verse">다만 우리가 <span class="hlb">신비</span>(<span class="b">mystery</span>) 속에 있는 <span class="y">하나님의 지혜</span>를 말하노니,<br>바로 <span class="hlb">감추어진</span> <span class="y">지혜</span>라. 그것은 하나님께서 우리의 영광을 위하여<br>세상을 세우시기 이전에 제정하신 것이라.<br>이 지혜는 이 <span class="o">세상 통치자들</span> 중에서는 아무도 몰랐노라.<br>이는 그들이 그것을 <span class="r">알았더라면</span><br>그들은 영광의 <span class="r">주를 십자가에 못 박으려 하지 않았을 것</span>이기 때문이라.</div>
  <div class="verse"><span class="o">통치자들</span>과 <span class="o">권세들</span>을 <span class="r">무력화</span>하여 드러내어 <span class="r">구경거리</span>로 삼으시고,<br><span class="y">십자가</span>로 그들을 <span class="y">이기셨느니라</span>.</div>
  <div class="src">고린도전서 2:7-8 / 골로새서 2:15 (개역개정)</div>
</div>
