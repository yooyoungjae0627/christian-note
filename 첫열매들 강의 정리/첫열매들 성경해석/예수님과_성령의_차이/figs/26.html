<div class="slide left" style="gap:30px">
  <div class="title"><span class="hlb">비밀</span>의 계시</div>
  <div class="verse">…<span class="b">그분</span>께 예언자 이사야의 책이 전달되었더라…<br>“<span class="g">그분</span>께서 <span class="b">나</span>를 보내셨으니, 상한 마음이 된 자들을 치유하기 위함이요,<br>포로가 된 자들에게 구출을 선포하기 위함이요…<br><span class="g">주</span>(YHWH)께서 기꺼이 받으시는 해를 선포하기 위함이라.”…<br>“이 성경 기록이 이날 너희의 귀에 성취되었느니라.” 하셨느니라.</div>
  <div class="verse"><span class="y">그분</span>께서는 여기에 계시지 아니하고 오히려 <span class="y">살아나셨도다</span>…<br>그러고는 그분께서 모세와 모든 예언자들부터 시작하여<br>성경 기록들에서 자신에 관한 것들을 그들에게 <span class="y">자세히 설명하셨더라</span>.</div>
  <div class="src">누가복음 4:17-19, 21 / 24:6, 27</div>
