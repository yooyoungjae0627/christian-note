<div class="slide left" style="gap:30px">
  <div class="title"><span class="g">아버지</span>와 <span class="b">아들</span>의 지식의 차이</div>
  <div class="verse">하늘과 땅은 없어질 것이나…<br>그날과 그 시각에 대하여 아는 사람은 아무도 없나니, 없도다.<br>하늘에 있는 천사들도 모르고 <span class="b">아들</span>도 <span class="b">모르며</span> <span class="g">아버지</span>만 <span class="g">아시느니라</span>.</div>
  <div class="verse"><span class="g">은밀한 것들</span>은 주 우리 <span class="g">하나님</span>께 속하느니라. 그러나<br>그처럼 <span class="b">계시된 것들</span>은 영원토록 우리에게와 우리 자녀들에게 속하나니,<br>우리로 하여금 이 율법의 모든 말씀들을 행하게 하려 하심이라.</div>
  <div class="verse">…<span class="g">하나님께 속한 것들</span>은 어떤 사람도 모르나,<br>오직 <span class="g">하나님의 영</span>께서만 아시느니라.</div>
  <div class="src">마가복음 13:31-32 / 신명기 29:29 / 고린도전서 2:11</div>
</div>
