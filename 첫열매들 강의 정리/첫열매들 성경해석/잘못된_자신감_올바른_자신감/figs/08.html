  <div class="title"><span class="k">부자의 자신감</span></div>
  <div class="verse" style="text-align:left"><p>…그분께서 그들에게 비유로 말씀하시며 이르기를,<br>“어떤 한 <span class="k">부유한 사람</span>의 경지가 <span class="k">풍요</span>롭게 결실을 냈느니라.<br>그러자 그가 자기 속으로 생각하며 말하기를…<br>‘나는 나의 혼에게 말하기를, ‘나의 혼아,<br>너는 <span class="k">여러 해</span>를 대비하여 <span class="k">많은 소유물</span>들을 쌓아 올렸도다.<br>너는 <span class="k">안락</span>을 누리면서 먹고 마시며 즐거워하라.’ 하리라.’<br>그러나 하나님께서는 그에게 말씀하시기를,<br>‘너 <span class="r">어리석은 자</span>야, 이 밤에 너에게서 너의 혼이 요구되리라…”</p></div>
  <div class="src">누가복음 12:16-17, 19-20</div>
