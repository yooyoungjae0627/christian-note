  <div class="verse" style="text-align:left"><p>…자신이 <span class="k">서 있다고</span> <span class="r">생각하는 자</span>는 자신이 <span class="g">넘어지지 않도록 주의하라</span>.</p><p class="gap"><span class="r">사악한 자들의 행로</span>에 들어서지 말고 <span class="r">악한 사람들의 길</span>로 다니지 말라.<br>그 길을 피하라. <span class="g">그 곁으로 지나가지도 말고</span> 거기서 <span class="g">돌이켜 떠나라</span>…<br>이는 그들이 <span class="r">사악함의 빵</span>을 먹고 <span class="r">폭력의 술</span>을 마시기 때문이라.</p><p class="gap">사람이 그의 품속에 <span class="r">불</span>을 품었는데 그의 옷이 <span class="r">타지 않을 수 있겠느냐</span>?<br>누군가 <span class="r">뜨거운 숯들</span> 위를 다니는데 그의 두 발이 <span class="r">타지 않을 수 있겠느냐</span>?</p></div>
