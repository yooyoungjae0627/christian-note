  <div class="verse" style="text-align:left"><p>…‘우리가 <span class="k">무엇을 먹을까</span>?’ 또는 ‘우리가 <span class="k">무엇을 마실까</span>?’<br>또는 ‘우리가 <span class="k">무엇으로 입혀질까</span>?’ 하면서 걱정하지 말라.<br>(이는 이 모든 것들을 이방인들이 추구하기 때문이라.)<br>이는 너희 하늘 아버지께서는 너희에게<br><span class="g">이 모든 것들이 필요하다는 것을 아시기 때문이라</span>.<br>오직 너희는 먼저 하나님의 왕국과 그분의 의를 구하라.<br>그리하면 이 모든 것들이 <span class="g">너희에게 더해지리라</span>.<br>그러므로 <span class="k">내일</span>을 위해 <span class="g">걱정하지 말라</span>…<br>그날의 <span class="r">악</span>은 그날로 족하니라.</p></div>
