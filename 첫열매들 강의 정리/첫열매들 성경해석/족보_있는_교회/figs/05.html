  <div class="title">욥이 구원을 받은 순간</div>
  <div class="box y verse">"제가 귀로 듣는 것을 통하여 당신에 관하여 들어 왔나이다.<br>그러나 <span class="y">이제 제 눈이 당신을 보나이다.</span>"</div>
  <div class="verse">이는 내가 나의 구속주께서 살아 계시는 것과<br>그분께서 마지막에 가까운 날에 땅 위에 서실 것을 알기 때문이라.<br>그리고 나의 피부의 벌레들이 이 몸을 멸한 뒤라 할지라도<br>여전히 나는 나의 육체 안에서 하나님을 보리라.<br>그분을 내가 직접 쳐다볼 것이요,<br>다른 이의 두 눈이 아닌 나의 두 눈이 볼 것이라…</div>
  <div class="src">욥기 42:5 / 19:25-27</div>
