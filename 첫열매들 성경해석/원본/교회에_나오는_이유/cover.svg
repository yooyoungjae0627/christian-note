<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 깨뜨린 옥합: 마리아가 "다시 담을 수도 없게" 옥합을 깨뜨려 감송향유를 붓고, "그 집이 향유 냄새로 가득 차더라" — 깨진 병 목, 흘러내리는 향유, 퍼지는 향기 -->
  <defs>
    <radialGradient id="glow101" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#f3e6c4" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#f3e6c4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#c9973b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="oil101" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e6c4"/>
      <stop offset="1" stop-color="#c9973b"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#c9973b" stroke-width="2" stroke-opacity=".6"/>
  <circle cx="100" cy="104" r="70" fill="url(#glow101)"/>
  <!-- 퍼지는 향기 -->
  <g fill="none" stroke="#f3e6c4" stroke-width="1.5" stroke-linecap="round" stroke-opacity=".7">
    <path d="M62 64 C54 54 66 46 58 36"/>
    <path d="M138 64 C146 54 134 46 142 36"/>
    <path d="M80 48 C74 40 84 34 78 24"/>
    <path d="M120 48 C126 40 116 34 122 24"/>
  </g>
  <!-- 옥합 몸통 -->
  <path d="M84 70 C70 78 62 96 64 116 C66 138 80 152 100 152 C120 152 134 138 136 116 C138 96 130 78 116 70 Z" fill="#18233f" fill-opacity=".9" stroke="#c9973b" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- 깨진 병 목 (들쭉날쭉한 깨진 자리) -->
  <path d="M86 70 L88 60 L92 66 L96 56 L100 64 L105 55 L108 65 L112 59 L114 70" fill="none" stroke="#f3e6c4" stroke-width="2" stroke-linejoin="round"/>
  <!-- 금 간 자리 -->
  <path d="M100 64 L97 82 L103 94 L99 108" fill="none" stroke="#c9973b" stroke-width="1.3" stroke-opacity=".8" stroke-linecap="round"/>
  <!-- 몸통 장식 -->
  <path d="M68 104 C86 112 114 112 132 104" fill="none" stroke="#c9973b" stroke-width="1.4" stroke-opacity=".8"/>
  <path d="M66 122 C86 130 114 130 134 122" fill="none" stroke="#c9973b" stroke-width="1.4" stroke-opacity=".6"/>
  <!-- 깨진 조각 -->
  <g fill="#18233f" stroke="#c9973b" stroke-width="1.6" stroke-linejoin="round">
    <path d="M162 160 L170 152 L176 162 L168 167 Z"/>
    <path d="M40 160 L48 152 L54 162 Z"/>
  </g>
  <!-- 흘러내리는 향유 -->
  <path d="M114 66 C130 62 142 74 146 92" fill="none" stroke="url(#oil101)" stroke-width="3" stroke-linecap="round"/>
  <path d="M146 92 C149 112 145 138 148 160" fill="none" stroke="#f3e6c4" stroke-width="2.4" stroke-linecap="round" stroke-opacity=".85"/>
  <circle cx="148" cy="166" r="3" fill="#f3e6c4"/>
  <!-- 바닥과 고인 향유 -->
  <path d="M30 172 H170" stroke="#c9973b" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="148" cy="176" rx="18" ry="3.5" fill="#f3e6c4" fill-opacity=".55"/>
  <g fill="#f3e6c4">
    <circle cx="44" cy="80" r="1.5"/><circle cx="156" cy="84" r="1.6"/><circle cx="100" cy="30" r="1.3"/><circle cx="36" cy="120" r="1.1"/><circle cx="166" cy="118" r="1.2"/>
  </g>
</svg>
