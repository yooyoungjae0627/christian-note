<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 마음의 병: 하나님이 걸으라고 하신 길 한복판 — 가장자리는 소용돌이(태풍), 길 중앙에는 태풍의 눈 같은 고요함과 평온한 하트 -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="100" cy="100" r="86" stroke="#e8c870" stroke-width="2" stroke-opacity=".5"/>
    <!-- 바깥 소용돌이(세상의 폭풍) -->
    <path d="M30 78 C40 52 66 34 96 32" stroke="#a9b8d8" stroke-width="1.8" stroke-opacity=".7"/>
    <path d="M170 122 C160 148 134 166 104 168" stroke="#a9b8d8" stroke-width="1.8" stroke-opacity=".7"/>
    <path d="M40 66 C52 48 72 40 92 40" stroke="#a9b8d8" stroke-width="1.4" stroke-opacity=".5"/>
    <path d="M160 134 C148 152 128 160 108 160" stroke="#a9b8d8" stroke-width="1.4" stroke-opacity=".5"/>
    <path d="M150 50 C162 62 168 76 168 90" stroke="#a9b8d8" stroke-width="1.4" stroke-opacity=".5"/>
    <path d="M50 150 C38 138 32 124 32 110" stroke="#a9b8d8" stroke-width="1.4" stroke-opacity=".5"/>
    <!-- 길: 아래에서 위로 좁아지는 길과 가운데 선 -->
    <path d="M62 176 L94 92" stroke="#f4ecd8" stroke-width="2" stroke-opacity=".85"/>
    <path d="M138 176 L106 92" stroke="#f4ecd8" stroke-width="2" stroke-opacity=".85"/>
    <path d="M100 172 V160 M100 150 V140 M100 131 V123 M100 115 V109" stroke="#e8c870" stroke-width="2"/>
    <!-- 태풍의 눈: 고요한 원과 그 안의 하트 -->
    <circle cx="100" cy="72" r="22" stroke="#e8c870" stroke-width="2"/>
    <circle cx="100" cy="72" r="30" stroke="#e8c870" stroke-width="1" stroke-opacity=".45"/>
    <path d="M100 82 C88 74 86 66 91 62 C95 59 99 61 100 65 C101 61 105 59 109 62 C114 66 112 74 100 82 Z" stroke="#f4ecd8" stroke-width="1.8"/>
  </g>
  <g fill="#f4ecd8">
    <circle cx="58" cy="100" r="1.3"/><circle cx="146" cy="104" r="1.3"/><circle cx="128" cy="40" r="1.5"/>
  </g>
</svg>
