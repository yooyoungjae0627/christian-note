<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 저주받은 몸(점선)이 하늘 재질의 몸(금빛·빛살)으로 바뀌는 부활, 위에는 하나로 묶인 두 반지(부부 = 한 사람) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
    <circle cx="100" cy="104" r="86" stroke="#e8c870" stroke-opacity=".5"/>
    <!-- 왼쪽: 지금의 몸(점선) -->
    <g stroke="#f4ecd8" stroke-opacity=".75" stroke-dasharray="4 4">
      <circle cx="58" cy="92" r="10"/>
      <path d="M44 154 V120 Q44 106 58 106 Q72 106 72 120 V154 Z"/>
    </g>
    <!-- 화살표 -->
    <path d="M84 132 H112 M104 125 L112 132 L104 139" stroke="#9fc3ff" stroke-opacity=".8"/>
    <!-- 오른쪽: 바뀐 몸(금빛, 빛살) -->
    <g stroke="#e8c870">
      <circle cx="142" cy="92" r="10"/>
      <path d="M128 154 V120 Q128 106 142 106 Q156 106 156 120 V154 Z"/>
      <path d="M142 72 V64 M126 78 L120 72 M158 78 L164 72 M120 98 H112 M164 98 H172" stroke-opacity=".8"/>
    </g>
    <!-- 하나로 묶인 두 반지 -->
    <circle cx="91" cy="46" r="13" stroke="#e8c870"/>
    <circle cx="109" cy="46" r="13" stroke="#f4ecd8"/>
    <path d="M26 158 H174" stroke="#9fc3ff" stroke-opacity=".5"/>
  </g>
  <g fill="#f4ecd8">
    <circle cx="40" cy="58" r="1.6"/><circle cx="160" cy="54" r="1.8"/><circle cx="170" cy="120" r="1.2"/><circle cx="30" cy="118" r="1.3"/>
  </g>
</svg>
