  <div class="title"><span class="g">아버지와</span> <span class="b">아들</span></div>
  <div class="verse">…<span class="p">모세</span>가 말씀드리기를, “제가 당신께 간청하오니,<br><span class="g">당신의 영광</span>을 제게 보여 주소서.” 하였더라…<br>이어서 그분께서 말씀하시기를, “너는 나의 얼굴을 볼 수 없느니라.<br>이는 <span class="y">나</span>를 <span class="p">보고도 살아남을 사람이 아무도 없기 때문이라</span>.” 하셨느니라.<br><br>“…너는 그분의 이름을 <span class="b">예수</span>라 부를지니라.<br>이는 그분께서 <span class="p">자기 백성을 그들의 죄들에서</span> <span class="y">구원</span>하실 것이기 때문이라.”</div>
  <div class="src">출애굽기 33:18, 20 / 마태복음 1:21</div>
