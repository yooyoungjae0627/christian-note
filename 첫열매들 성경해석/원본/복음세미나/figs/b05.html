  <div class="verse">…한 번 <span class="p">죽는 것</span>은 <span class="p" style="border:3px solid #c77dff;border-radius:50%;padding:0 6px">사람</span>들에게 정해져 있으나<br>이후에는 <span style="background:#e0303a;color:#fff;padding:0 6px;border-radius:4px">심판</span>이 정해져 있는 것같이<br><br>…<span class="b">남자</span>는…자기 <span class="p">아내</span>와 결합할 것이니,<br>그들 둘이 <span class="p" style="border:3px solid #c77dff;border-radius:50%;padding:0 8px">한 육체</span>가 되리라.<br>이것은 하나의 <span class="y">위대한 신비</span>(<span class="y">great mystery</span>)라.<br>그러나 나는 <span class="b">그리스도</span>와 <span class="p">교회</span>에 관하여 말하는 것이라.</div>
