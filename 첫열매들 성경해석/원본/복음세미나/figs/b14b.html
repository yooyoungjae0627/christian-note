  <div class="title p">갈등</div>
  <div class="verse">하셨느니라. 그러자 한 천사가 하늘로부터 그분께 나타나서<br>그분께 힘을 돋우어 주었더라. 그리고 그분께서는 심한 고뇌 가운데<br>계셨으므로 더욱 열렬하게 기도하셨더라. 그러자 그분의 땀이<br><span class="p">커다란 핏방울들같이 되어</span>…떨어져 내렸더라.</div>
