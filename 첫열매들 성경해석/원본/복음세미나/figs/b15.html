  <div class="title"><span class="b">남편</span>의 <span class="p">대속</span></div>
  <div class="verse" style="font-size:38px">그때 그들이 그분의 얼굴에 <span class="p">침 뱉으며</span> 그분을 <span class="p">주먹으로 쳤더라</span>.<br>그러자 다른 이들은 그분을 자신들의 <span class="p">손바닥으로 치며</span> 말하기를,<br>“너, 그리스도여, 우리에게 예언하라. 너를 친 자는 누구냐?”…<br><br>…예수님을 잡아다가 그분을 <span class="p">채찍질하였더라</span>…군인들은<br><span class="p">가시나무들로 왕관 하나를 엮어서</span>…그분의 머리 위에 씌웠고…<br><br>…그분을 <span class="p">십자가에 못 박았더라</span>.</div>
  <div class="src">마태복음 26:67-68 / 요한복음 19:1-2 / 마가복음 15:25</div>
</div>
