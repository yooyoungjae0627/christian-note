  <div class="title"><span class="d">구약 예언</span>의 <span class="p">성취</span></div>
  <div class="verse">…예수님께서 이제 모든 것들이 이루어졌음을 아시고<br><span class="d">성경</span> 기록이 <span class="b">성취되게</span> 하려고 말씀하시기를, “내가 목마르다.” 하시니라…<br>그들이 해면을 식초에 충분히 적신 후에 그것을 우슬초에 달아서<br>그것을 그분의 입에 대었더라. 그러므로 예수님께서 그 식초를 받으신 후에<br>친히 말씀하시기를, “<span class="b">다 이루어졌도다</span>.” 하셨느니라.<br>그러고 나서 그분께서는 자신의 머리를 숙이고 <span class="p">숨을 거두셨더라</span>.</div>
  <div class="src">요한복음 19:28-30</div>
