  <div class="title p">지옥의 고통</div>
  <div class="verse" style="font-size:34px;line-height:1.6">…인자도…삼 일 낮과 삼 일 밤을<br><span class="p">땅의 심장 속</span>에 있을 것이기 때문이라.<br><br>…하나님께서 그분을 일으켜 세우시어 <span class="p">사망의 고통</span>들에서<br>풀어 주셨느니라…이는 당신께서 저의 <span class="b">혼</span>을 <span class="p">지옥</span>에<br>남겨 두지 아니하실 것이요…<br><br>그분께서는 여기 계시지 아니하시니라.<br>이는 그분께서 자신이 말씀하신 대로 <span class="y">살아나셨기</span> 때문이라…</div>
