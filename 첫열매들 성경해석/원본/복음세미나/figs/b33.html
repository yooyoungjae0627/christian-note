  <div class="mid" style="font-size:38px">마르틴 루터 (1483–1546): 종교개혁을 시작해 개신교의 출발점이 됨</div>
  <div class="verse" style="text-align:center;font-size:38px">“<span class="b">믿음</span>은 우리 안에서 일어나는 <span class="g">하나님의 역사</span>이다…<br>우리는 <span class="b">그리스도를 믿는 믿음</span>을 통해 <span class="y">의롭다</span> 하심을<br>받고 <span class="y">구원</span>을 얻는다.”</div><div style="font-size:28px;color:#cfd3e0">[로마서 서문 1522]</div>
