  <div class="mid" style="font-size:38px">조지 휫필드 (1714–1770): 18세기 대각성 운동을 이끈 영국의 유명한 설교자</div>
  <div class="verse" style="text-align:center;font-size:38px">“참된 <span class="y">구원</span>의 <span class="b">믿음</span>은 <span class="g">하나님의 선물</span>이며,<br>이 <span class="b">믿음</span>으로 우리는 하나님 앞에서<br><span class="y">의롭다</span> 하심을 받는다.”</div><div style="font-size:28px;color:#cfd3e0">[조지 휫필드 설교집 –아브라함의 이삭 제사 1758]</div>
  <div class="verse" style="text-align:center;font-size:36px">…너희가 은혜로 <span class="y">구원</span>받은 것은 <span class="b">믿음</span>을 통한 것이기<br>때문이니, 이는 너희 자신에게서 난 것이 아니요,<br>그것은 <span class="g">하나님의 선물</span>이라.</div><div style="font-size:28px;font-weight:700;color:#cfd3e0">에베소서 2:8</div>
