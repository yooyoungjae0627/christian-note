  <div class="verse" style="text-align:right;font-size:33px;line-height:1.6">…아이의 아버지가 울부짖으며 눈물로 말하기를<br>“주여, <span class="o">내가 믿나이다</span>.<br>나의 <span class="y">믿음 없음</span>을 도와주소서.”라고 하더라.<br><br>“‘…그의 <span class="o">끈질긴 간청</span> 때문에 그가 일어나서<br>그가 필요한 만큼 그에게 줄 것이라…구하라.<br>그리하면 그것이 너희에게 주어질 것이요.’…<br>하늘 아버지께서는 그분께 구하는 자들에게 <span class="g">거룩한 영</span>을<br><span class="o">얼마나 더 많이 주시겠느냐</span>?”</div>
