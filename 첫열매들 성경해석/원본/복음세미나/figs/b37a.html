  <div class="verse">그러므로 누구든 <span class="y">[그리스도]</span> 안에 있다면 그는 <span class="y">새로운 창조물</span>이라.<br><span class="p">오래된 것들</span>은 사라져 버렸으니, 보라, 모든 것들이 <span class="y">새로워졌도다</span>…<br>그분께서는 <span class="b">예수 그리스도</span>를 통하여 우리를 그분 자신과<br><span class="y">화해</span>하게 하셨으며, <span class="y">화해의 사역</span>을 우리에게 주셨도다.</div>
