  <div class="verse">그러자 모세가 와서 주의 모든 말씀들과 모든<br>공의로운 법규들을 백성에게 알렸더라. 그러자 모든<br>백성이 한 목소리로 대답하고 말하기를, “주께서<br>하신 모든 말씀들을 저희가 실행하겠나이다.”<br>하였더라.</div>
  <div class="src">(출애굽기 24:3)</div>
