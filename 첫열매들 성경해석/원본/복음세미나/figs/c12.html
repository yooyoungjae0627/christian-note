  <div class="verse">그런데 왕이 손님들을 보려고 들어왔을 때, 그가<br>거기서 결혼식 의복 한 벌도 갖추지 않은 남자를<br>보았노라. 그리하여 그가 그에게 말하기를,<br>‘친구여, 그대는 어찌 결혼식 의복 한 벌도 갖추지<br>않은 채 여기로 왔는가?’ 하니라…</div>
  <div class="src">(마태복음 22:11-12)</div>
