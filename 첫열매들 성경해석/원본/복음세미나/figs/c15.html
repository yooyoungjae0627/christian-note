  <div class="verse">그리고 하나님께서 그들에게 복을 주셨으며 하나님께서<br>그들에게 말씀하시기를, “다산하고 번성하여 땅을<br>다시 채우고 그것을 정복하라. 또 바다의 물고기와<br>공중의 날짐승과 땅 위에서 움직이고 살아 있는<br>각각의 모든 것을 지배하라.”</div>
  <div class="src">(창세기 1:28)</div>
