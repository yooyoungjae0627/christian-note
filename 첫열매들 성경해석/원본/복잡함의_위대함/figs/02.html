  <div class="title">인간이 생각하는 <span class="pk">정의</span></div>
  <div class="verse">…너희는 말하기를, ‘주의 길이 <span class="pk">공평</span>하지 아니하도다.’ 하는도다…<br>나의 길이 <span class="bk">공평</span>하지 아니한 것이냐? 너희 길들이 불공평한 것이 아니냐?<br>&nbsp;<br>…그분의 역사는 <span class="bk">완벽</span>하시도다.<br>이는 그분의 모든 길들이 <span class="bk">공의</span>이기 때문이라.<br>그분은 <span class="bk">진실</span>하시고 죄악이 없으신 한 하나님이시며,<br><span class="bk">공정</span>하시고 <span class="bk">의로우시도다</span>.</div>
  <div class="src">에스겔 18:25 / 신명기 32:4</div>
