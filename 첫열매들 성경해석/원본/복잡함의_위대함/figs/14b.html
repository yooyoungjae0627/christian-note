  <div class="title">자연을 통해 증명되는 하나님의 <span class="bk">정의</span></div>
  <div class="verse">그분께서 <span class="bk">위대한 것들</span>을 행하시나니, 우리는 깨달을 수 없는 것들이니이다.<br>남쪽에서는 <span class="bk">회오리바람</span>이 나오고 <span class="bk">추위</span>는 북쪽에서 나오나이다…<br>그분께서 그분의 환한 <span class="bk">구름</span>을 흩으시나이다.<br>또 그것이 그분의 계획들에 의하여 방향을 빙 돌리나이다…오, 욥이여,<br>이것을 경청하소서. 가만히 서서 하나님의 <span class="bk">경이로운 역사들</span>을 숙고하소서.</div>
  <div class="src">욥기 35:5-6, 36:26-27, 37:5, 9, 11-12, 14</div>
