  <div class="title">자연을 통해 증명되는 하나님의 <span class="bk">정의</span></div>
  <div class="verse">측량줄을 펼쳤느냐?…<span class="bk">비</span>에게 아버지가 있느냐? 아니면 <span class="bk">이슬방울</span>들은<br>누가 낳았느냐?…하늘의 백색 <span class="bk">서리</span>, 그것은 또 누가 태어나게 하였느냐?…<br>너는 하늘의 법령들을 아느냐?…누가 <span class="bk">까마귀</span>를 위하여<br>그의 양식을 제공하느냐? 그의 어린것들이 하나님을 향하여 울고<br>그것들이 음식의 부족으로 인하여 방황할 때 누가 양식을 제공하느냐?</div>
  <div class="src">욥기 38:1-5, 28-29, 33, 41</div>
