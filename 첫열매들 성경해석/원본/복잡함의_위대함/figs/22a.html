  <div class="title">자연을 통해 증명되는 하나님의 <span class="bk">정의</span></div>
  <div class="verse">그때 욥이 주께 대답하여 이같이 말씀드렸더라. “당신께서 모든 것을<br>저마다 행하실 수 있다는 것과 어떤 생각도 당신께 숨겨질 수 없다는 것을<br>제가 아나이다…그러므로 저는 제가 이해하지 못한 것을 발설하였나니,<br>제게 <span class="bk">너무 경이로운 것들</span>이요, 제가 몰랐던 것이니이다…</div>
  <div class="src">욥기 42:1-6, 12</div>
