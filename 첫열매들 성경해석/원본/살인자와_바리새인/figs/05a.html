<div class="slide left" style="gap:30px">
  <div class="title"><span class="y">구원의 복음에 관해</span></div>
  <div class="verse">…하나님께서 세상을 이처럼 사랑하셨기 때문에 그분께서 자신의 독생자를 주셨으니…<span class="y">영원한 생명</span>을 얻게 하려 하심이라.</div>
  <div class="verse">그분께서는 모든 사람들을 <span class="y">구원받게</span> 하기를 원하시고, 또 진리의 지식에 이르게 하기를 원하시느니라… 그분께서 모두를 위하여 하나의 <span class="y">속량 값으로 자신을 주셨으니</span>…</div>
  <div class="src">요한복음 3:16 / 디모데전서 2:4, 6 / 마가복음 8:36-37</div>
