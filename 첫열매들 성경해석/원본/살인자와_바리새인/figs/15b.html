  <div class="title"><span class="g">회개</span>의 기회</div>
  <div class="verse">…하나님의 선하심이 너를 <span class="g">회개</span>로 이끄시는 것을 모른 채, 네가 그분의 선하심과 관용과 오래 참으심의 부요함을 멸시하는 것이냐? 오직 너의 <span class="r">완고함</span>과 <span class="r">회개하지 아니하는 마음</span>을 따라 <span class="r">진노</span>의 날이요, 하나님의 의로운 심판이 드러나는 날을 대비하여 너 자신에게 <span class="r">진노</span>를 쌓아 올리는도다.</div>
  <div class="src">요한복음 7:17 / 로마서 2:4-5</div>
