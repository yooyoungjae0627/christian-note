  <div class="title"><span class="g">하나님</span>이 <span class="r">안 계신 것 같은 착각</span></div>
  <div class="verse"><div>…<span class="r">악한 일에 대한 판결</span>이 <span class="g">신속하게 집행되지</span> 아니하기 때문이라. 그러므로 사람들의 아들들의 마음이 그들 안에서 <span class="r">악을 행하기로</span> 완전히 정해지는도다.…땅 위에서 행해지는 헛된 것이 있으니, 곧 <span class="r">사악한 자들의 행위에 따른 일</span>이 <span class="g">의인들</span>에게 발생하며, 또 한편 <span class="g">의로운 자들의 행위에 따른 일</span>이 <span class="r">사악한 사람들</span>에게 발생한다는 것이라…</div></div>
