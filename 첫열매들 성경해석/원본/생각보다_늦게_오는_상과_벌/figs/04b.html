  <div class="verse"><div>그리하여 그분께서 너를 겸손하게 하셨고, <span class="o">배고픔</span>을 감내하게 하셨으며, 너도 모르고 너의 조상들도 몰랐던 만나로 너를 먹이셨으니, 그분께서 너로 하여금 사람이 <span class="o">빵</span>으로만 사는 것이 아니요, 다만 주의 입에서 나오는 각각의 모든 <span class="g">말씀</span>으로 사람이 사는 것임을 알게 하려 하심이라.</div></div>
