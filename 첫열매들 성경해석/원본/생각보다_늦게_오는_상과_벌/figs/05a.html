  <div class="verse"><div>또한 사람이 그의 아들을 <span class="r">징계</span>하듯이 주 너의 하나님께서 너를 그와 같이 징계하시는 것을 너는 너의 <span class="g">마음속에 숙고</span>할지니라. 그러므로 너는 주 너의 하나님의 명령들을 지켜 그분의 길들 가운데 살아가고 그분을 <span class="g">두려워할지니라</span>. 이는 주 너의 하나님께서 너를 좋은 지역 가운데로 데리고 들어가시기 때문이니…</div></div>
