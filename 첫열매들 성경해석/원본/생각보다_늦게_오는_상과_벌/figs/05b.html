  <div class="title"><span class="g">상</span>을 늦추시는 이유: <span class="g">겸손</span></div>
  <div class="verse"><div>네가 먹어서 <span class="g">배부르면</span> 그때 너는 그분께서 너에게 주신 그 좋은 지역으로 인하여 주 너의 <span class="g">하나님을 찬양</span>할지니라. 내가 이날에 너에게 명령하는 그분의 명령들과 그분의 공의로운 법규들과 그분의 규례들을 네가 지키지 않음으로 인하여 주 너의 <span class="g">하나님을 잊지 않도록 주의하라</span>.</div></div>
