  <div class="title"><span class="g">상</span>을 늦추시는 이유: <span class="g">겸손</span></div>
  <div class="verse"><div>그리고 네가 너의 마음속에 말하기를, ‘<span class="r">나의 권능과 내 손의 막강함</span>이 나로 하여금 이 부를 얻게 하였도다.’ 하지 않게 하려 함이라. 오직 너는 주 너의 하나님을 기억할지니라. 이는 <span class="g">너에게 부를 얻을 권능</span>을 주시는 분이 <span class="y">그분</span>이시기 때문이요…</div></div>
