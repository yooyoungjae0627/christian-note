  <div class="title"><span class="g">상</span>을 늦추시는 이유: <span class="g">연단</span></div>
  <div class="verse"><div>그러자 그분께서 이같이 말씀하셨느니라. “내가 너희에게 진실되이 말하노니, 이 <span class="g">가난한 과부</span>가 그들 모두보다 더 많이 던져 넣었도다. 이는 이들 모두가 자신들의 풍요함 가운데서 하나님께 드리는 제물들로 던져 넣었으나 그녀는 자신의 빈곤함 가운데서 그녀가 가진 <span class="g">생활비 전부</span>를 던져 넣은 것이기 때문이라.”</div></div>
  <div class="src">누가복음 21:3-4</div>
