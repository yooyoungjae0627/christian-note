  <div class="verse"><div>이후에 백성이 <span class="r">원망</span>하자 그것이 주를 <span class="r">불쾌</span>하게 하였더라… 그리고 그분의 <span class="r">분노</span>에 불이 붙었더라. 그리하여 <span class="o">주의 불</span>이 그들 가운데서 타올라 진영의 맨 끝부분들에 있던 자들을 살랐더라. 그러자 백성이 모세에게 부르짖었더라. 이에 <span class="g">모세가 주께 기도</span>하자 그 <span class="o">불</span>이 <span class="g">꺼졌더라</span>…</div></div>
