  <div class="verse"><div>그리고 백성은 돌아다니면서 그것을 모았다가 그것을 맷돌들 안에 넣고 <span class="g">갈거나</span>, 그것을 절구 안에다 넣고 <span class="g">찧거나</span>, 그것을 납작한 냄비들 안에다 넣고 <span class="g">굽거나</span>, 그것으로 둥글납작한 <span class="g">빵들</span>을 만들었더라. 또 그것의 맛은 <span class="g">신선한 기름의 맛</span>과 같았더라…</div></div>
