  <div class="title"><span class="o">세상 것을 주시며 경고</span></div>
  <div class="verse"><div>그러자 백성이 그날 온종일과 온밤, 또 다음날 온종일 일어서 있었으니, 그들이 <span class="o">메추라기</span>들을 모았더라…그리고 그들의 <span class="o">치아 사이에 고기</span>가 아직 있어 그것이 씹히기도 전에 <span class="r">주의 진노</span>가 백성을 대적하여 타올랐으니, 주께서 <span class="r">매우 심한 재앙</span>으로 백성을 치셨더라.</div></div>
