  <div class="title"><span class="o">세상 것을 주시며 경고</span></div>
  <div class="verse"><div>네가 <span class="o">치리자</span>와 함께 식사하러 앉을 때면 너의 앞에 있는 것이 무엇인지 부지런히 숙고하라. 그런즉 만일 네가 식욕에 빠진 사람이라면, 너의 목구멍에 단도를 두라. 그의 <span class="o">진미들</span>을 <span class="r">갈망</span>하지 말라. 이는 그것들이 속임수로 가득한 음식이기 때문이라… 너는 <span class="o">악인들</span>에 대하여 <span class="r">시기</span>하지 말며 그들과 <span class="r">함께 있기를 열망</span>하지도 말라.</div></div>
