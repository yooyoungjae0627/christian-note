  <div class="title"><span class="o">세상 것을 주시며 경고</span></div>
  <div class="verse"><div>너의 헛된 생애의 모든 날들 동안…너에게 주신 <span class="o">아내</span>와 함께 충만한 즐거움으로 살라. 이는 그것이 네가 해 아래에서 취하는 네가 수고한 것 가운데 이 인생에서의 <span class="o">너의 몫</span>이기 때문이라. <span class="o">너의 손이 하려고 찾은 일</span>은 무엇이든지, 너의 역량을 다하여 그 일을 하라. 이는 네가 가는 <span class="r">음부</span> 속에는 일도 없고 계책도 없으며 지식도 없고 지혜도 없기 때문이라.</div></div>
  <div class="src">전도서 9:9-10</div>
