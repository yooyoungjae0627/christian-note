  <div class="verse"><div>오, 청년아, 너의 <span class="o">젊음</span>을 크게 기뻐하라. 그리고 너의 젊음의 날들에 너의 마음으로 하여금 네게 <span class="o">기운</span>을 내게 하고 너의 마음의 길들 가운데 너의 <span class="o">두 눈이 보는 대로 살아가라</span>. 그러나 너는 알지니, 이 모든 것들로 인하여 하나님께서 너를 <span class="r">심판</span> 가운데로 데려가시리라.</div></div>
