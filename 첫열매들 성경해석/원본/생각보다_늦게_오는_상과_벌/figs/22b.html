  <div class="title"><span class="o">세상 것을 주시며 경고</span>: <span class="y">회개</span></div>
  <div class="verse"><div>그리하여 그가 말씀드리기를, “주여, 당신은 누구시니이까?” 하였더라. 이에 주께서 말씀하시기를, “나는 네가 박해하는 예수니라. <span class="y">가시들에 발길질</span>하는 것은 너에게 모진 일이라.” 하셨느니라.</div></div>
  <div class="src">사도행전 9:5</div>
