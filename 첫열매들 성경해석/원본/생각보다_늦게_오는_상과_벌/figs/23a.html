  <div class="title"><span class="r">단계별</span>로 <span class="g">기다리시는 하나님</span></div>
  <div class="verse"><div>…하나님의 <span class="g">선하심</span>이 너를 <span class="g">회개</span>로 이끄시는 것을 모른 채, 네가 그분의 <span class="g">선하심</span>과 <span class="g">관용</span>과 <span class="g">오래 참으심</span>의 부요함을 <span class="r">멸시</span>하는 것이냐? 오직 너의 <span class="r">완고함</span>과 <span class="r">회개하지 아니하는 마음</span>을 따라 <span class="r">진노</span>의 날이요, 하나님의 의로운 심판이 드러나는 날을 대비하여 너 자신에게 <span class="r">진노를 쌓아 올리는도다</span>.</div></div>
  <div class="src">로마서 2:4-5</div>
