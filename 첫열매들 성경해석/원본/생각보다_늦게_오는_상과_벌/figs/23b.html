  <div class="verse"><div>그러므로 그분께서 그의 위에 그분의 <span class="r">분노</span>의 <span class="o">노여움</span>과 전투의 힘을 쏟아부으셨도다. 그런즉 그것이 주위에서 그에게 <span class="r">불을 질렀는데</span> 그럼에도 그는 <span class="r">몰랐도다</span>. 또 그것이 그를 <span class="r">태웠는데</span> 그럼에도 그가 그것을 <span class="r">마음에 두지 아니하였도다</span>.</div></div>
