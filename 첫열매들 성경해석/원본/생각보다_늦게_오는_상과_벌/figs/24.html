  <div class="title"><span class="r">단계별</span>로 <span class="g">기다리시는 하나님</span></div>
  <div class="verse"><div>…우리야의 아내가 자신의 남편인 우리야가 죽었다는 것을 들었을 때 그녀가 자신의 남편을 위하여 애곡하였더라. 그리고 애곡하는 기간이 지나자 <span class="y">다윗</span>이 사람을 보내어 그녀를 자기 집으로 데려왔으니, 그녀가 그의 <span class="r">아내가 되어</span> 그에게 한 <span class="r">아들을 낳아 주었더라</span>. 그러나 다윗이 행한 그 일이 <span class="g">주</span>를 <span class="r">불쾌</span>하게 하였더라.</div></div>
  <div class="src">사무엘하 11:26-27</div>
