  <div class="title"><span class="r">단계별</span>로 <span class="g">기다리시는 하나님</span>: 권면</div>
  <div class="verse"><div>그러나 그 가난한 남자에게는 그가 사서 키운 작고 어린 암양 한 마리를 제외하면 아무것도 없었나이다. 그러자 그것이 그와 함께, 또 그의 자식들과 함께 자랐나이다. 그것이 그가 먹는 음식을 먹고 그가 마시는 잔에서 마시고 그의 품 안에 누웠으니, 그에게는 한 명의 딸과 같았나이다.</div></div>
  <div class="src">사무엘하 12:3</div>
