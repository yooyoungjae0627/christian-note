  <div class="title"><span class="r">단계별</span>로 <span class="g">기다리시는 하나님</span>: <span class="y">회개</span></div>
  <div class="verse"><div>오히려 그 가난한 남자의 어린양을 취하여 자신에게 온 사람을 위하여 그것을 요리해 주었나이다.” 그러자 그 남자를 대적하여 다윗의 분노가 대단히 크게 타올랐더라. 그리하여 그가 나단에게 이같이 말하였더라. “주께서 살아 계심을 두고 맹세하노니, 이 일을 행한 그 남자는 반드시 죽으리라…그에게 동정심이 없었기 때문이라.”</div></div>
  <div class="src">사무엘하 12:4-6</div>
</div>
