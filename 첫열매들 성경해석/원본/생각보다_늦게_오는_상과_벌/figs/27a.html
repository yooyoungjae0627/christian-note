  <div class="title"><span class="g">하나님의 용서</span></div>
  <div class="verse"><div><span class="hy">이에</span> 나단이 다윗에게 이같이 말하였더라. “주께서도 <span class="y">당신의 죄를 치워 버리셨으니</span>, 당신께서는 <span class="y">죽지 아니하시리이다</span>. 하지만 이 행동을 통하여 당신께서 주의 원수들에게 신성 모독을 하도록 커다란 빌미를 주었으므로 당신께 <span class="r">태어난 자식 또한 반드시 죽으리이다</span>.”</div></div>
