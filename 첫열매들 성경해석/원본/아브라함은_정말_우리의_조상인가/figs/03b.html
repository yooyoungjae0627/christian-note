  <div class="title"><span class="y">내면적 유대인</span></div>
  <div class="verse">또한 그들이 <span class="y">아브라함의 씨</span>라고 하여 그들이 모두 <span class="y">자녀</span>들인 것은<br>아니기 때문이라. 다만 “이삭 안에서 너의 씨가 부름을 받으리라.”<br>하셨느니라. 즉, <span class="y">육체의 자녀들</span>인 자들, 곧 이들은 <span class="y">하나님의 자녀들</span>이<br>아니니라. 오직 <span class="y">약속의 자녀들</span>이 그 씨로 여겨지느니라.</div>
