  <div class="title"><span class="g">에스겔 성전 = 셋째 하늘 성전</span></div>
  <div class="verse">이는 그리스도께서는 손들로 지어진 <span class="y">거룩한 처소들</span>,<br>곧 <span class="g">참된 것</span>의 <span class="y">모형들</span> 안으로 들어가지 않으셨고,<br>오히려 <span class="g">하늘 그 자체</span> 안으로 들어가셨기 때문이니…<br><br><span class="g">시작부터 영광스럽고 높은 보좌</span>는 <span class="g">우리의 성소</span>가 속한 곳이라.</div>
  <div class="src">히브리서 9:24 / 예레미야 17:12 / 에스겔 37:26 / 요한계시록 21:22</div>
