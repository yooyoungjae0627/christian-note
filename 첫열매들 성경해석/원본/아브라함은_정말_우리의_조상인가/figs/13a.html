  <div class="title"><span class="y">아브라함의 구원</span></div>
  <div class="verse">이제 주께서 <span class="h">아브람</span>에게 전에 이같이 말씀하셨더라. “너는 <span class="o">너의 고향</span>과<br><span class="o">너의 친족</span>과 <span class="o">너의 아버지의 집</span>에서 나와서 <span class="g">내가 너에게 보여 줄 지역</span>으로 가라.<br>그리하면 내가 너로부터 <span class="y">위대한 민족</span>을 만들겠노라…<br>그리하여 네 안에서 <span class="o">땅의 모든 족속</span>들이 복을 받으리라.”</div>
