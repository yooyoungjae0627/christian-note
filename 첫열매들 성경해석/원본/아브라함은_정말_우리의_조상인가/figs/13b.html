  <div class="verse">그렇게 하여 <span class="h">아브람</span>은 주께서 그에게 이르신 대로 떠났으며…<br>그리고 <span class="h">아브람</span>이 하란을 떠났을 때는 그가 칠십오 세였더라.<br>그리하여 <span class="h">아브람</span>이 자기 아내 사래와 자기 조카 롯과 그들이 모은 그들의<br>모든 재물과 하란에서 그들이 얻은 혼들을 데리고 갔더라.<br>그리고…그들이 <span class="g">가나안 지역</span>으로 들어갔더라.</div>
