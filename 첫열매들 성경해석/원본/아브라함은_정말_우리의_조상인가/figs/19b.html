  <div class="verse">곧, <span class="o">행위들</span> <span class="r">없이</span> <span class="g">하나님</span>께서 <span class="y">의를 전가</span>하시는 사람의 <span class="y">복</span>을 다윗 또한<br>묘사하는 것과 같으니 말하기를,<br>“<span class="y">죄악들이 용서되고 죄들이 가려진 자들은 복되도다.</span><br><span class="y">주께서 그에게 죄를 전가하지 아니하실 사람은 복되도다.</span>” 하였도다.<br>그렇다면 이 <span class="y">복</span>이 <span class="o">할례자</span>에게만 임하느냐,<br>아니면 <span class="o">무할례자</span>에게도 임하느냐?…</div>
