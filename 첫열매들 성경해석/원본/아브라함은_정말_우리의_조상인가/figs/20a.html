  <div class="title"><span class="y">아브라함의 구원</span></div>
  <div class="verse">그렇다면 어떻게 그 <span class="b">믿음</span>이 <span class="y">의</span>로 간주되었느냐?<br>그가 <span class="y">할례자</span>로 있었을 때냐, 아니면 <span class="o">무할례자</span>로 있었을 때냐?<br><span class="y">할례자</span>로 있었을 때가 아니라 다만 <span class="o">무할례자</span>로 있었을 때라.<br>그런 다음에 그가 믿음에서 나온 의의 인장, 곧 할례의 표적을 받았으니,<br>그 믿음은 그가 아직 <span class="o">할례받지 아니하였을 때</span> <span class="y">소유</span>했던 것이라.</div>
