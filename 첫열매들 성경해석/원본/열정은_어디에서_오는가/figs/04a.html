  <div class="title"><span class="b">결심</span> + <span class="g">성령</span> = <span class="h">열정</span></div>
  <div class="verse">…형제들아…너희는 <span class="o">너희의 몸</span>을 거룩하고 하나님께서 기꺼이 받으실<br>만한 <span class="b">살아 있는 희생 제물</span>로 드리라. 이것이 너희의 <span class="o">합당한 섬김</span>이라.<br>그런즉 이 <span class="b">세상에 동화되지 말고</span> 오히려 너희는 너희 생각을 새롭게<br>함으로써 <span class="b">변화를 받을지니</span>, 너희로 하여금 하나님의 <span class="g">선하신 뜻</span>과 기꺼이<br><span class="g">받으실 만한 뜻</span>과 <span class="g">완전하신 뜻</span>이 무엇인지 입증하게 하려 함이라…</div>
  <div class="src">로마서 12:1-2</div>
