  <div class="title"><span class="h">역할</span>대로 쓰임</div>
  <div class="verse">…몸에서 더 <span class="o">나약해 보이는 그 지체들</span>이 훨씬 더 <span class="gl">요긴</span>하니라. 그리하여 우리가<br><span class="o">덜 존귀</span>하다고 생각하는 몸의 그 지체들 위에 우리가 더 <span class="gl">넘치는 존귀</span>를<br>부여하느니라. 그런즉 우리의 <span class="o">볼품없는 부분들</span>도 더욱 <span class="gl">넘치게 어여쁨</span>을<br>받느니라. 이는 우리의 어여쁜 부분들은 부족한 것이 전혀 없기 때문이라.<br>그러나 하나님께서 <span class="o">부족한 그 부분</span>에 더 <span class="gl">넘치는 존귀</span>를 주시어<br>그 몸이 함께 조화를 이루게 하셨느니라.</div>
  <div class="src">고린도전서 12:22-24</div>
