  <div class="title"><span class="r">박해</span>를 이기는 <span class="gl">힘</span></div>
  <div class="verse">사람들이 나로 인하여 너희를 <span class="r">욕하고</span>, 너희를 <span class="r">박해하며</span>,<br>너희를 대적하여 <span class="r">온갖 부류의 악한 것을 거짓되이 말할 때</span>,<br>너희는 <span class="gl">복</span>되도다. 크게 기뻐하고 지극히 반가워하라.<br>이는 하늘에서 <span class="y">너희의</span> <span class="gl">보상</span><span class="y">이 크나크기 때문</span>이니,<br>그들이 너희 앞에 있었던 <span class="y">예언자들</span>도 그렇게 <span class="r">박해</span>하였기 때문이라.</div>
  <div class="src">마태복음 5:11-12 (한킹)</div>
