  <div class="title"><span class="gl">상</span><span class="b">을 받을 생각</span></div>
  <div class="verse">믿음으로 모세는 자신이 나이가 들었을 때 파라오의 딸의 아들이라<br>불리기를 거부하였느니라. 그는 한동안 죄의 쾌락들을 즐기는 것보다는<br>도리어 하나님의 백성과 함께 <span class="r">고난</span>을 겪는 것을 <span class="b">선택</span>하였느니라.<br>그는 그리스도의 <span class="r">치욕</span>을 이집트의 보물들보다 더 크나큰 재물들로<br>여겼느니라. 이는 그가 그 <span class="gl">보상</span>의 삯을 <span class="b">소중히 여겼기 때문</span>이라.</div>
  <div class="src">히브리서 11:24-26</div>
