  <div class="title"><span class="gl">확실한 소망</span></div>
  <div class="verse">우리가 자신에 차 있으니 정녕 몸에서 떠나 주와 함께 있는 것을 오히려<br>더 원하노라. 이 때문에 우리가 애쓰는 것은 거하든지 떠나 있든지<br><span class="y">그분을 기쁘시게 해 드리기</span>를 바라는 것이라. 이는 우리 모두가 반드시<br>그리스도의 심판석 앞에 나아가서 선이든지 악이든지 각자 자기가<br>행한 것에 따라, 자기 <span class="gl">몸</span>으로 (<span class="i">행한 것들을</span>) <span class="y">받을 것</span>이기 때문이라.</div>
