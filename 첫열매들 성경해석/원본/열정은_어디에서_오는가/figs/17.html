  <div class="title"><span class="gl">확실한 소망</span></div>
  <div class="verse">…너는 모든 것들에 깨어 있고 <span class="r">고난</span>들을 견디며 <span class="y">복음 전도자의 일</span>을 하고<br>너의 사역을 <span class="y">충분히 입증</span>하라. 이는 내가 이제 제물로 드려질 준비가<br>되어 있으며 나의 떠날 때가 가깝기 때문이라. 내가 <span class="y">훌륭한 싸움</span>을 싸웠고,<br>내가 나의 달려갈 길을 마쳤으며, 내가 믿음을 지켰노라.<br>이후로는 나를 위하여 의의 <span class="gl">왕관</span>이 마련되어 있으니,<br>의로운 심판자이신 주께서 그것을 그날에 나에게 주실 것이라.</div>
