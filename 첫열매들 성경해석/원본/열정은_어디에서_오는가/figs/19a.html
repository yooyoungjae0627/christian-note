  <div class="title"><span class="o">이 세상에서의 성공</span></div>
  <div class="verse">그러자 예수님께서 대답하여 이같이 말씀하셨느니라.<br>“진실로 내가 너희에게 말하노니, 나를 위하여 그리고 <span class="o">복음</span>을 위하여<br><span class="o">집</span>이나 <span class="o">형제</span>들이나 자매들이나 <span class="o">아버지</span>나 <span class="o">어머니</span>나 <span class="o">아내</span>나 <span class="o">자녀</span>들이나<br><span class="o">토지</span>들을 <span class="y">버린 사람</span>은 받지 못하는 일이 없으리니,<br>오히려 그는 지금 이때에 집들과 형제들과 자매들과 어머니들과<br>자식들과 토지들을 <span class="r">박해들</span>과 함께 <span class="y">일백 배</span>로 받으리라.<br>그리고 <span class="g">오는 세상</span>에서는 영생을 받으리라.</div>
  <div class="src">마가복음 10:29-30</div>
