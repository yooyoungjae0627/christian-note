  <div class="title"><span class="y">정의</span>를 위한 <span class="y">기도</span></div>
  <div class="verse"><span class="r">저의 상처를 크게 기뻐하는 자들</span>이 함께 <span class="r">수치</span>를 당하고 <span class="r">혼란</span>에 처하게<br>하소서. <span class="r">저를 대적하여 자신들을 드높이는 자들</span>이 <span class="r">수치</span>와 <span class="r">불명예</span>로<br>옷 입혀지게 하소서. <span class="y">저의 의로운 주장을 지지하는 자들</span>이 즐거움으로<br><span class="y">환호</span>하고 반가워하게 하소서. 진정 그들이 지속적으로 말하기를,<br>“<span class="y">자신의 종</span>의 <span class="gl">형통</span>함을 기뻐하시는 주께서는 드높여지실지어다.”<br>하게 하소서.</div>
  <div class="src">시편 35:26-27</div>
