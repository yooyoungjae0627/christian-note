  <div class="verse">그분께서…기운이 없는 자들에게 <span class="gl">힘</span>을 늘리시는도다. 젊은이들이라도<br>기진하고 지칠 것이요, 청년들도 완전히 쓰러지리라. 그러나 주를<br>고대하는 자들은 자신들의 <span class="gl">힘</span>을 새롭게 하리라. 그들은 독수리들같이<br>날개들로 치솟으리라. 그들은 달려도 지치지 아니할 것이요,<br>또 그들은 걸어도 기진하지 아니하리라.</div>
