  <div class="title b"><span class="hlb">비밀</span>인 예수라는 이름</div>
  <div class="verse">그리하여 야곱이 홀로 남겨졌는데 거기서 한 남자가 동이 틀 때까지<br>그와 맞붙어 싸웠더라…이에 야곱이 그에게 물어 말하기를,<br>“제가 당신께 간구하오니, 제게 당신의 이름을 알려 주소서.” 하였더라.<br>그러자 그가 말하기를, “<span class="b">어찌 너는 나의 이름을 묻느냐</span>?” 하였더라.<br>그리고 그가 거기에서 야곱에게 복을 주었더라.<br>그리하여 야곱이 그곳의 이름을 프니엘이라 불렀으니,<br>이는 “내가 얼굴과 얼굴을 마주하여 <span class="b">하나님</span>을 보았으나<br>내 생명이 보존되었도다.” 하였기 때문이라.</div>
  <div class="src">창세기 32:24, 29-30</div>
</div>
