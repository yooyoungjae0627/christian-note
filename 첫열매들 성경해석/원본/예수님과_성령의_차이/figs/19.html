<div class="slide left" style="gap:24px">
  <div class="title g">남편</div>
  <div class="verse">이는 너를 만든 이가 너의 <span class="g">남편</span>이기 때문이라.<br>만군의 <span class="g">주</span>(YHWH)가 그의 이름이니, 너의 <span class="y">구속주</span>요…</div>
  <div class="verse">…내가 그들에게 <span class="g">남편</span>이었을지라도 그들이 나의 <span class="y">언약</span>을 파기한 것이라…<br>그러나 내가 이스라엘 집과 맺을 <span class="y">언약</span>은 이러하도다.<br><span class="g">주</span>(YHWH)가 말하노라…</div>
  <div class="verse">…<span class="g">주</span>(YHWH)가 말하노라. 곧, 그날에 너는 나를 ‘<span class="y">이시</span>’라고 부르며…</div>
  <div class="verse">이는 <span class="b">그리스도</span>께서 교회의 머리이신 것같이, <span class="b">남편</span>이 아내의 머리이기<br>때문이라. 그런즉 그분께서는 그 몸의 <span class="y">구원자</span>이시니라.</div>
  <div class="src">이사야 54:5 / 예레미야 31:32-33 / 호세아 2:16 / 에베소서 5:23</div>
