  <div class="verse" style="text-align:center;margin-top:40px">삼위일체 교리는<br>하나님이 <span class="r">한 하나님</span>(<span class="r">One God</span>)이시며,<br>서로를 알고, 서로를 사랑하는<br><span class="r">세 인격</span>(<span class="r">Three Persons</span>)으로<br>영원히 존재하신다는 것이다.<br>그렇기에 하나님이 근본적으로<br><span class="r">세 분이기보다는 한 분</span>이라 할 수 없으며,<br><span class="r">한 분이기보다는 세 분</span>이라 할 수 없다.</div>
