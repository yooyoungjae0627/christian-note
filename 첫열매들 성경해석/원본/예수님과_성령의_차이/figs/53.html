  <div class="title" style="left:60px;right:auto">테르툴리아누스 (155-220): <span style="font-weight:600">라틴 신학의 아버지, 삼위일체 용어의 창시자</span></div>
  <div class="verse" style="text-align:center;margin-top:50px">“모든 만물이 있기 전에 <span class="g">하나님</span>은 <span class="g">홀로 계셨다</span>…<br>그러나 그때에도 그분은 <span class="b">홀로 계신 것이 아니었으니</span>,<br>자기 <span class="g">자신 안에 지니고 계셨던</span><br><span class="g">그분 자신</span>의 ‘<span class="b">이성</span>(<span class="b">Reason</span>)’을<br><span class="g">그분</span>과 <span class="b">함께 두셨기 때문</span>이다…<br>이제 <span class="g">하나님</span>께서 그분 <span class="g">자신 안에</span>,<br>그분의 <span class="b">지혜</span>의 <span class="b">이성</span>과 <span class="b">말씀</span>과 함께 계획하시고<br>정하셨던 것들을 각각의 실체와 형태로<br><span class="b">밖으로 드러내시기를</span> 기뻐하셨을 때,<br>그분은 먼저 <span class="b">말씀 그 자체</span>를 <span class="g">내놓으셨다</span>.”</div>
  <div class="txt" style="font-weight:700">『프락세아스 반박 A.D. 213』</div>
</div>
