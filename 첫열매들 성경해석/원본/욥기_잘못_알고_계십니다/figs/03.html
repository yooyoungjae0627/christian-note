  <div class="title hd" style="left:80px;right:auto;top:30px"><span class="y">2. 장 칼뱅 (1509-1564):</span> 종교개혁 시대에 개혁신학을 체계적으로 정리</div>
  <div class="verse" style="font-size:36px;line-height:1.62;text-align:center">“하나님께서 <span class="p">우리를</span> <span class="r">치시기</span> 위해 그의 손을<br>드신다 하더라도 <span class="p">우리가</span> 그 이유를<br>알지 못할지라도…<br>하나님께 <span class="r">불평하거나</span><br><span class="y">하나님과 다투어서는</span> 안 된다…<br><span class="p">우리는</span> 불평하지 않기 위해 <span class="y">잠잠해야</span> 하며,<br>하나님께서 왜 <span class="p">우리를</span> <span class="r">징계</span>하시는지<br>밝히 보여 주시기를 <span class="y">기다려야</span> 한다.”</div>
  <div class="src">[욥기 설교 1554–1555]</div>
