  <div class="verse" style="">오 어리석은 갈라디아 사람들아, <span class="y">예수 그리스도</span>께서 너희 가운데서<br><span class="y">십자가에 못박히신</span> 채로 너희의 눈 앞에 <span class="y">분명히</span> <span class="h">제시</span>되었는데<br>너희가 진리에 순종하지 못하도록 누가 너희를 미혹하더냐?<span class="gap"></span>“…아브라함은 <span class="y">나(<span class="i">예수</span>)</span>의 날을 <span class="h">보는 것</span>을 크게 기뻐하였느니라.<br>그리하여 그가 그것을 <span class="h">보았고</span> 반가워하였느니라.”</div>
