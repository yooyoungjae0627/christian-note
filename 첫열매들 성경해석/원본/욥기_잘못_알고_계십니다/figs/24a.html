  <div class="verse" style="font-size:38px">“<span class="y">이러한 이유</span>로 제가 제 자신을 <span class="o">혐오</span>하고 티끌과 재들 속에서<br><span class="ho">회개</span>하나이다.”<span class="gap"></span>…주께서 사탄에게 말씀하시기를, “너는 <span class="o">나의 종</span> 욥을 숙고해 보았느냐?<br>그는 <span class="o">완전</span>하고 <span class="o">올바른</span> 사람이요, <span class="o">하나님을 두려워하고</span> <span class="o">악을 기피</span>하는<br>이로서 땅에는 그와 같은 자가 아무도 없느니라.” 하셨느니라.</div>
