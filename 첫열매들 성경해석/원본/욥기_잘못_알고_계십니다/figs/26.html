  <div class="title"><span class="r">욥의 회개하지 않는 친구들</span></div>
  <div class="verse" style="font-size:37px">…주께서는 테만인 <span class="r">엘리파스</span>에게도 말씀하시기를<br>“내 진노가 너와 네 <span class="r">두 친구</span>를 향해 일어났나니,<br>이는 너희가 내 종 <span class="y">욥</span>이 한 것같이 내게 <span class="y">옳은 것</span>을 <span class="r">말하지 않았음</span>이라.”<span class="gap"></span>“제가 <span class="o">귀로 듣는 것을 통하여</span> <span class="g">당신에 관하여</span> <span class="o">들어 왔나이다</span>.<br>그러나 이제 <span class="y">제 눈이 당신을 보나이다</span>. <span class="y">이러한 이유</span>로 제가 제 자신을<br><span class="o">혐오</span>하고 티끌과 재들 속에서 <span class="ho">회개</span>하나이다.”</div>
  <div class="src">욥기 42:7 (한킹) / 42:5-6</div>
</div>
