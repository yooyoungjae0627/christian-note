  <div class="title"><span class="y">깨달음의 눈 = 하나님의 시선</span></div>
  <div class="verse" style="font-size:40px">이에 주 하나님께서 아담을 부르시며…“네가 어디에 있느냐?”<br>하셨느니라. 그러자 아담이 말씀드리기를,<br>“제가 동산에서 당신의 음성을 듣고는 <span class="y">제가 벌거벗은 까닭에</span><br>제가 무서웠나이다. 그리하여 제가 저의 몸을 숨겼나이다.” 하였더라.</div>
  <div class="src">창세기 3:9-10</div>
