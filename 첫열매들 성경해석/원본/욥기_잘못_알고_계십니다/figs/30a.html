  <div class="title"><span class="o">고난 받는 욥:</span> <span class="y">의인</span>이었나?</div>
  <div class="verse" style="font-size:36px">그의 아들들이 각자 자기 생일에 가서 자기들의 집에서 잔치를 베풀고…<br>먹고 마시더라. 그 잔칫날들이 지나면 욥이 사람을 보내서<br>그들을 <span class="y">성결케</span> 하였는데 아침 일찍 일어나 그들 모두의 수대로<br><span class="o">번제</span>를 드렸으니 이는 욥이 말하기를 “혹시 내 아들들이 <span class="r">죄를 짓고</span><br>그들의 마음속에 <span class="r">하나님을 저주</span>하였을까 하노라.” 함이더라.<br>욥은 <span class="o">계속해서 이같이</span> 행하더라.</div>
  <div class="src">욥기 1:4-5 (한킹)</div>
