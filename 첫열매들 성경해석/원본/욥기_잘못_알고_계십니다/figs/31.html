  <div class="title"><span class="y">참 형상을 본 성인들</span></div>
  <div class="verse" style="font-size:34px">…아브라함이 말하기를, “내 아들아,<br><span class="b">하나님</span>께서 <span class="b">자신을 번제물</span>을 위한 <span class="b">어린양</span>으로 <span class="b">마련</span>하실 것이라.”<br>하였더라. 그렇게 하여 그들 둘이 함께 갔더라.<span class="gap"></span>이는 당신께서 <span class="o">희생 제물</span>을 <span class="g">바라지 아니하시기 때문</span>이니이다.<br>그렇지 아니하였더라면 제가 그것을 드렸을 것이니이다.<br>당신께서는 <span class="o">번제물</span>을 크게 <span class="g">즐거워하지 아니하시나이다</span>.<br>하나님의 <span class="o">희생 제물들</span>은 <span class="r">상한 영</span>이니이다. 오, 하나님이여,<br>당신께서는 <span class="r">상하고 참회하는 마음</span>을 <span class="y">멸시하지 아니하시리이다</span>.</div>
  <div class="src">창세기 22:8 / 시편 51:16-17</div>
