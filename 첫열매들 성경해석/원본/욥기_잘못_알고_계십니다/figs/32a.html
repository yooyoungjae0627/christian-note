  <div class="title"><span class="b">중재인</span></div>
  <div class="verse" style="font-size:35px">그분은 나처럼 사람이 아니시기에 내가 그분께 <span class="r">대답할 수 없고</span><br>우리가 함께 <span class="hr">재판</span>으로 나올 수 없도다. 또한 우리 사이에는,<br>자신의 손을 우리 모두 위에 얹을 수 있는 어떤 <span class="b">중재인</span>도 <span class="r">없도다</span>.<br>그분께서 그분의 막대기를 나에게서 거두어 가시게 하고<br>그분의 두려우심이 나를 공포스럽게 하지 않게 하라.<br>그때 비로소 내가 이야기할 것이요, 그분을 <span class="y">두려워하지 아니하리라</span>.<br>그러나 나에게 그것은 <span class="r">그렇지 아니하도다</span>.</div>
