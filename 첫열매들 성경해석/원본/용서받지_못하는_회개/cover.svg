<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 용서받지 못하는 회개: 소제 — 고운 곡물 가루를 담은 그릇 위로 기름이 부어지는 장면. 가루처럼 부서져야 기름(성령)을 붙든다 -->
  <g fill="none" stroke="#e8c870" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="100" cy="100" r="86" stroke-opacity=".5"/>
    <!-- 기름 단지 -->
    <path d="M112 30 C126 26 140 32 142 44 C144 54 136 62 124 64 L110 66 C104 62 102 52 104 44 Z" stroke="#f4ecd8" stroke-opacity=".9"/>
    <path d="M104 44 C98 46 92 52 90 58" stroke="#f4ecd8" stroke-opacity=".9"/>
    <path d="M118 30 C118 24 128 22 132 28" stroke="#f4ecd8" stroke-opacity=".7"/>
    <!-- 부어지는 기름 줄기 -->
    <path d="M90 58 C88 72 92 86 90 104" stroke="#e8c870" stroke-width="2.6"/>
    <circle cx="94" cy="80" r="1.2" fill="#e8c870"/>
    <!-- 그릇 -->
    <path d="M42 128 C52 152 148 152 158 128 Z" stroke="#e8c870"/>
    <path d="M40 128 H160" stroke="#e8c870"/>
    <path d="M84 150 L78 162 H122 L116 150" stroke="#e8c870" stroke-opacity=".8"/>
    <!-- 고운 가루 더미 -->
    <path d="M54 128 C66 110 84 102 100 102 C116 102 134 110 146 128" stroke="#f4ecd8"/>
    <path d="M86 108 C92 112 104 112 112 108" stroke="#e8c870" stroke-opacity=".8"/>
  </g>
  <g fill="#f4ecd8" fill-opacity=".85">
    <circle cx="70" cy="122" r="1.1"/><circle cx="80" cy="116" r="1.1"/><circle cx="96" cy="112" r="1.1"/>
    <circle cx="110" cy="117" r="1.1"/><circle cx="124" cy="114" r="1.1"/><circle cx="134" cy="122" r="1.1"/>
    <circle cx="88" cy="124" r="1.1"/><circle cx="104" cy="124" r="1.1"/><circle cx="118" cy="125" r="1.1"/>
  </g>
  <g fill="#f4ecd8">
    <circle cx="48" cy="60" r="1.4"/><circle cx="62" cy="44" r="1.2"/><circle cx="160" cy="76" r="1.6"/>
  </g>
</svg>
