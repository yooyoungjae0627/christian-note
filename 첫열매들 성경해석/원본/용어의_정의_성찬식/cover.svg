    <path d="M74 92 H126 C126 112 116 124 100 126 C84 124 74 112 74 92 Z" stroke="#f3e7c9"/>
    <path d="M79 100 H121" stroke="#c9973b" stroke-opacity=".8"/>
    <path d="M100 126 V146 M86 152 H114 M90 146 H110" stroke="#f3e7c9"/>
    <!-- 찢긴 빵 두 조각 -->
    <path d="M34 150 C34 136 50 130 62 136 L58 142 L64 147 L60 154 C52 160 34 160 34 150 Z" stroke="#f3e7c9" stroke-opacity=".9"/>
    <path d="M166 150 C166 136 150 130 138 136 L142 142 L136 147 L140 154 C148 160 166 160 166 150 Z" stroke="#f3e7c9" stroke-opacity=".9"/>
    <!-- 한 육체: 큰 형상과 손잡은 작은 형상들 -->
    <circle cx="92" cy="44" r="7" stroke="#f3e7c9"/>
    <path d="M92 52 V74 M84 68 L92 58 L110 68 M88 74 L86 84 M96 74 L98 84" stroke="#f3e7c9"/>
    <circle cx="114" cy="58" r="4.5" stroke="#c9973b"/>
