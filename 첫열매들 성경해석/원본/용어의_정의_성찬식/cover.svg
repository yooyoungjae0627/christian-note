<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 성찬의 잔과 둘로 찢긴 빵 — 잔 위로 머리(큰 형상)와 손잡은 작은 형상들(한 육체), 저주의 몸에서 빛나는 몸으로 -->
