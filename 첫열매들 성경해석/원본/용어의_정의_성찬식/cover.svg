    <circle cx="126" cy="52" r="4.5" stroke="#c9973b"/>
    <path d="M126 57 V72 M122 80 L126 72 L130 80 M118 70 L126 62 L134 70" stroke="#c9973b"/>
    <!-- 빛 -->
    <path d="M60 40 L66 44 M140 36 L134 41 M56 64 H64 M144 62 H136" stroke="#f3e7c9" stroke-opacity=".6"/>
  </g>
  <g fill="#f3e7c9">
    <circle cx="44" cy="96" r="1.4"/><circle cx="158" cy="98" r="1.6"/><circle cx="150" cy="116" r="1.2"/>
  </g>
</svg>
