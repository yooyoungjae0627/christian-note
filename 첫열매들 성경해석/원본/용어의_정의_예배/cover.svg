<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 예배의 본보기: 무화과 잎(스스로 가린 이파리)이 떨어지고, 하나님이 입혀 주신 가죽옷이 빛 가운데 놓임 -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="100" cy="100" r="86" stroke="#c9973b" stroke-width="2" stroke-opacity=".55"/>
    <!-- 위에서 내려오는 빛 -->
    <path d="M100 22 V36 M78 28 L84 40 M122 28 L116 40 M60 40 L70 49 M140 40 L130 49" stroke="#f3e7c9" stroke-width="2" stroke-opacity=".6"/>
    <!-- 가죽옷(웃옷) -->
    <path d="M82 58 C88 64 112 64 118 58 L140 70 L132 92 L122 87 L124 150 C108 156 92 156 76 150 L78 87 L68 92 L60 70 Z" stroke="#f3e7c9" stroke-width="2.4"/>
    <path d="M82 58 C90 72 110 72 118 58" stroke="#f3e7c9" stroke-width="2"/>
    <!-- 가죽의 꿰맨 자국 -->
    <path d="M100 74 V146" stroke="#c9973b" stroke-width="1.6" stroke-dasharray="3 5"/>
    <!-- 왼쪽 아래로 떨어진 무화과 잎 -->
    <path d="M38 132 C34 118 42 106 52 108 C54 98 66 98 66 110 C76 110 78 122 68 128 C70 138 58 144 50 138 C44 142 38 140 38 132 Z" stroke="#c9973b" stroke-width="2"/>
    <path d="M40 140 L62 116 M50 128 L46 118 M56 122 L62 114 M54 126 L64 126" stroke="#c9973b" stroke-width="1.4" stroke-opacity=".85"/>
    <!-- 오른쪽 아래 작은 잎 -->
    <path d="M150 140 C148 130 154 122 162 124 C164 116 174 118 172 128 C178 132 174 142 166 142 C162 148 152 148 150 140 Z" stroke="#c9973b" stroke-width="1.8" stroke-opacity=".8"/>
    <path d="M152 146 L168 128" stroke="#c9973b" stroke-width="1.3" stroke-opacity=".7"/>
    <!-- 바닥선 -->
    <path d="M40 166 H160" stroke="#c9973b" stroke-width="1.6" stroke-opacity=".6"/>
  </g>
  <g fill="#f3e7c9">
    <circle cx="44" cy="62" r="1.4"/><circle cx="158" cy="60" r="1.6"/><circle cx="150" cy="44" r="1.2"/><circle cx="52" cy="46" r="1.1"/>
  </g>
</svg>
