    <!-- 영(안쪽) -->
    <path d="M100 76 C96 76 94 79 94 82 C94 86 97 88 100 88 C103 88 106 86 106 82 C106 79 104 76 100 76 Z M90 134 V120 C90 112 94 108 100 108 C106 108 110 112 110 120 V134" stroke="#f3e7c9" stroke-width="1.4" stroke-opacity=".6"/>
    <!-- 떨어지는 방울: 물(크림) · 기름(금) -->
    <path d="M74 30 C70 37 68 40 68 43 C68 46.5 70.7 49 74 49 C77.3 49 80 46.5 80 43 C80 40 78 37 74 30 Z" stroke="#f3e7c9" stroke-width="1.8"/>
    <path d="M100 22 C96 29 94 32 94 35 C94 38.5 96.7 41 100 41 C103.3 41 106 38.5 106 35 C106 32 104 29 100 22 Z" stroke="#f3e7c9" stroke-width="1.8"/>
    <path d="M126 30 C122 37 120 40 120 43 C120 46.5 122.7 49 126 49 C129.3 49 132 46.5 132 43 C132 40 130 37 126 30 Z" stroke="#c9973b" stroke-width="2"/>
    <path d="M74 53 V57 M100 45 V54 M126 53 V57" stroke="#f3e7c9" stroke-width="1.2" stroke-opacity=".5"/>
    <!-- 잔물결 -->
    <path d="M42 156 C52 151 62 161 72 156 C82 151 92 161 100 156 C108 151 118 161 128 156 C138 151 148 161 158 156" stroke="#c9973b" stroke-width="1.8" stroke-opacity=".85"/>
    <path d="M56 168 C64 164 72 172 80 168 C88 164 96 172 104 168 C112 164 120 172 128 168 C134 165 140 169 144 168" stroke="#f3e7c9" stroke-width="1.4" stroke-opacity=".6"/>
