  <g fill="#f3e7c9">
    <circle cx="44" cy="62" r="1.4"/><circle cx="158" cy="64" r="1.4"/><circle cx="150" cy="40" r="1.2"/><circle cx="50" cy="40" r="1.2"/>
  </g>
</svg>
