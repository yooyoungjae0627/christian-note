  <div class="title"><span class="g">조용함</span>을 깨뜨리려는 <span class="r">사탄</span></div>
  <div class="verse">저의 <span class="r">원수들</span>인 자들이…그 지역에서 <span class="g">평온하게 지내는 자들</span>을 대적하여<br><span class="yg">속임수로 가득한 사건들</span>을 고안하나이다.</div>
  <div class="verse">제 <span class="r">원수</span>가 말하기를,<br>“내가 그를 대적하여 <span class="r">승리</span>하였도다.” 하지 못하게 하소서.<br>또 저를 곤경에 빠뜨리는 자들이 <span class="y">제가</span> <span class="r">동요</span>될 때<br>크게 기뻐하지 못하게 하소서.</div>
  <div class="src">시편 35:19-20, 13:4</div>
