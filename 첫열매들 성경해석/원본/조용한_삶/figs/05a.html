  <div class="title"><span class="r">시끄러운 삶</span></div>
  <div class="verse">…진실로 자신의 가장 <span class="yg">좋은 상태</span>에 있는 모든 사람이<br>저마다 전부 <span class="r">헛될 뿐</span>이니이다…확실히 모든 사람마다<br><span class="yg">허상</span> 가운데 살아가나이다. 과연 그들은 헛되이 <span class="r">불안</span>해하나이다.<br>그는 <span class="yg">재물</span>들을 무더기로 쌓아 올리면서도<br>누가 그것들을 거두어들일지 모르나이다.</div>
