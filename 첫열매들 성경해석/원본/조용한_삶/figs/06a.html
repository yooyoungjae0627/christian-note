  <div class="title"><span class="r">시끄러운 삶</span></div>
  <div class="verse">너희 중에 누가 <span class="r">걱정</span>함으로써 <span class="r">자신의 키</span>에 일 큐빗을 더할 수 있겠느냐?<br>…그러므로 말하기를, ‘우리가 무엇을 <span class="yg">먹을까</span>?’ 또는<br>‘우리가 무엇을 <span class="yg">마실까</span>?’ 또는 ‘우리가 무엇으로 <span class="yg">입혀질까</span>?’ 하면서<br>걱정하지 말라. (이는 이 모든 것들을 이방인들이 추구하기 때문이라.)<br>이는 너희 하늘 아버지께서는 너희에게 <span class="yg">이 모든 것들</span>이<br>필요하다는 것을 아시기 때문이라.</div>
  <div class="src">마태복음 6:27, 31-32</div>
</div>
