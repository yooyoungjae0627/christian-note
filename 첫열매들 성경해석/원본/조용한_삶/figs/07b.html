  <div class="title"><span class="r">시끄러운 삶</span></div>
  <div class="verse">그들이 하늘로 올라가다가, 그들이 다시 깊은 곳들로 내려가는도다.<br>곤경으로 인하여 그들의 <span class="r">혼이 녹는도다</span>.<br>그들이 이리저리 비틀거리고 술 취한 사람처럼 <span class="r">휘청거리나니</span>,<br>그들은 <span class="r">어찌할 바를 모르는도다</span>.</div>
  <div class="src">시편 107:26-27</div>
