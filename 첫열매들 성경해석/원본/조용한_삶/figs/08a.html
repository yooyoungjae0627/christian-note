  <div class="title"><span class="g">조용함으로 인한 구원</span></div>
  <div class="verse">주가 말하노라. <span class="r">반역하는 자녀들</span>에게 화가 있기를 바라노니,<br>그들이 계획을 세우나 나에게서 난 것이 아니요, 그들이 덮개로 덮으나<br>나의 영에서 난 것이 아니니…<span class="rg">파라오</span>의 <span class="rg">힘</span>으로 자신들을<br>강하게 하려는 것이요, 이집트의 그늘을 신뢰하려는 것이로다!<br>그러므로 <span class="rg">파라오</span>의 <span class="rg">힘</span>이 너희의 수치가 될 것이요,<br>이집트의 그늘을 신뢰하는 것이 너희의 당혹감이 되리라…</div>
  <div class="src">이사야 30:1-3</div>
</div>
