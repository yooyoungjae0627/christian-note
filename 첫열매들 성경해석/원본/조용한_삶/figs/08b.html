  <div class="title"><span class="g">조용함으로 인한 구원</span></div>
  <div class="verse">그 백성은 어떤 도움도, 유익도 되지 못하며<br>단지 <span class="r">수치</span>와 또한 <span class="r">치욕</span>일 뿐이로다…<br>이는 이스라엘의 거룩한 이, 주 하나님이 이같이 말하기 때문이라.<br>너희가 돌아와 <span class="g">안식함</span>으로 구원을 받을 것이요, <span class="g">잠잠하고 신뢰함</span>으로<br>너희의 힘이 있을 것이라. 그런데도 너희가 바라지 아니하는도다.</div>
  <div class="src">이사야 30:5, 15</div>
</div>
