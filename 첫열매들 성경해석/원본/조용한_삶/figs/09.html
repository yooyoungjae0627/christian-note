  <div class="title"><span class="g">조용함으로 인한 구원</span></div>
  <div class="verse">그때 그들은 자신들의 <span class="r">곤경</span> 속에서 주께 부르짖으니,<br>그분께서 그들을 자신들의 <span class="r">괴로움들</span>에서 데리고 나오시는도다.<br>그분께서 <span class="r">폭풍</span>을 <span class="g">고요하게</span> 하시므로, 그곳의 <span class="r">파도들</span>이 <span class="g">잔잔해지는도다</span>.<br>그때 그것들이 잔잔하므로 그들이 반가워하는도다. 그렇게 하여<br>그분께서 그들이 열망하던 항구로 그들을 데려오시는도다.</div>
  <div class="src">시편 107:28-30</div>
</div>
