  <div class="title"><span class="g">하나님을 믿기에</span></div>
  <div class="verse"><span class="y">번영의 날</span>에는 기뻐하고 <span class="r">역경의 날</span>에는 생각할지니,<br>하나님께서 또한 이것과 저것을 <span class="r">병행</span>하게 하셔서<br>사람으로 그의 뒤에 있을 일들을 <span class="g">알 수 없게</span> 하셨음이라.</div>
  <div class="verse">이는 왕이 <span class="g">주</span>를 <span class="g">신뢰</span>하기 때문이요, 지극히 높으신 분의 자비를 통하여<br>그가 <span class="g">동요하지 않을 것</span>이기 때문이니이다.</div>
  <div class="src">전도서 7:14(한킹) / 시편 21:7</div>
