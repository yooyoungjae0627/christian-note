  <div class="title"><span class="g">마음을 지키기</span></div>
  <div class="verse">그들은 다윗이 <span class="h">주의 집</span> <span class="g">안에서 배정</span>하여 모세의 율법 안에 기록된 대로<br>주의 번제물들을 바치며 다윗에 의하여 선임된 대로 크게 기뻐하고<br>노래하였더라. 그리고 그가 <span class="h">주의 집</span>의 <span class="r">대문들</span>에 <span class="g">문지기들</span>을 세웠으니,<br>어떤 일로든지 <span class="r">불결해진 자</span>는 아무도 <span class="g">들어오지 못하게</span> 하려 함이라…<br>그들이 <span class="r">아달리야</span>를 칼로 살해한 이후에 그 도시는 <span class="g">평강</span>을 누렸더라.</div>
  <div class="src">역대기하 23:18-19, 21</div>
