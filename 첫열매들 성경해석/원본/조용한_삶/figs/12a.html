  <div class="title"><span class="h">주의 집</span> <span class="g">안에서 배정</span></div>
  <div class="verse">네가 <span class="g">선</span>을 행하면 어찌 낯을 들지 못하겠느냐 <span class="g">선</span>을 행하지 아니하면<br>죄가 문에 엎드려 있느니라 죄가 너를 원하나 너는 죄를 다스릴지니라</div>
  <div class="verse">이제 <span class="g">은사들의 다양성들</span>이 있으나 <span class="g">성령</span>께서는 동일하시니라…<br>그러나 이것들이 모두 동일한 한 성령께서 역사하시어 그분의 뜻대로<br>모든 사람에게 저마다 <span class="g">개인별</span>로 나누어 주시는 것이라.</div>
  <div class="src">창세기 4:7(개역개정) / 고린도전서 12:4, 11</div>
