  <div class="title"><span class="g">마음을 지키기</span></div>
  <div class="verse">오, 나의 혼아, 너는 어찌하여 <span class="r">낙망</span>하느냐?<br>또 너는 어찌하여 내 안에서 <span class="r">불안</span>해하느냐? 너는 <span class="g">하나님을 소망</span>하라…</div>
  <div class="verse">주가 너의 <span class="r">슬픔</span>과 너의 <span class="r">두려움</span>과 네가 섬기게 되었던<br><span class="rg">힘든 속박</span>으로부터 너에게 <span class="g">안식</span>을 주리라.</div>
  <div class="src">시편 42:5 / 이사야 14:3</div>
