  <div class="title"><span class="g">하나님을 믿기에</span></div>
  <div class="verse">그리하여 그분께서 너를 겸손하게 하셨고, 배고픔을 감내하게 하셨으며,<br>너도 모르고 너의 조상들도 몰랐던 <span class="b">만나</span>로 너를 먹이셨으니, 그분께서<br>너로 하여금 사람이 빵으로만 사는 것이 아니요, 다만 주의 입에서<br>나오는 각각의 모든 <span class="b">말씀</span>으로 사람이 사는 것임을 알게 하려 하심이라.<br>이 사십 년 동안 네 위에 있는 너의 <span class="g">의상이 낡아지지 아니하였으며</span>,<br>너의 <span class="g">발도 부어오르지 아니하였느니라</span>.</div>
  <div class="src">신명기 8:3-4</div>
</div>
