  <div class="title"><span class="r">근심</span> ➡ <span class="g">근심</span></div>
  <div class="verse">하나님의 뜻대로 하는 <span class="g">근심</span>은 회개를 이루어 다시 돌이킬 수 없는<br>구원에 이르게 하거니와 세상의 <span class="r">근심</span>은 사망을 이루느니라.</div>
  <div class="verse">너희는 스스로 주의하라. 그렇지 않으면 언제라도 너희 마음이<br>과식과 술 취함과 <span class="r">이 세상 삶의 염려</span>로 무겁게 되어<br>그 날이 알지 못하게 너희에게 임할까 염려하노니</div>
  <div class="verse">…나에게 매일 닥쳐오는 것은 모든 <span class="g">교회들에 관한 염려</span>라.</div>
  <div class="src">고린도후서 7:10(흠정역) / 누가복음 21:34(흠정역) / 고린도후서 11:28</div>
</div>
