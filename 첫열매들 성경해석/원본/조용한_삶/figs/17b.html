  <div class="title"><span class="g">핍박과 고난</span></div>
  <div class="verse">그러자 즉시 예수님께서 그분의 손을 뻗으시어 그를 잡으셨으니<br>그에게 말씀하시기를,<br>“오, 너, <span class="r">믿음이 적은 자</span>여, 어찌 네가 <span class="r">의심</span>하였느냐?” 하셨느니라.<br>그런 다음에 그들이 그 <span class="h">선박</span> <span class="g">안으로</span> 들어가자 <span class="g">바람이 그쳤더라</span>.</div>
