  <div class="verse">그리고 내가 참된 <span class="y">멍에 동료</span>인 너에게도 간청하노니,<br>복음 안에서 나와 함께 수고하고 클레멘트와 함께하였으며,<br>나의 <span class="y">동료 일꾼들</span>과 함께한 저 여자들을 도우라.<br>그들의 이름들이 <span class="y">생명책</span> 안에 있느니라. 항상 주를 크게 기뻐하라…</div>
