  <div class="title"><span class="r">근심</span> ➡ <span class="g">근심</span></div>
  <div class="verse">그리하면 모든 지각을 초월하는, <span class="g">하나님의 평안</span>이 그리스도 예수를 통하여<br>너희의 <span class="g">마음과 생각을 지키시리라</span>. 마지막으로 형제들아…<br>무엇이든지 <span class="g">참된 것들</span>, 무엇이든지 <span class="g">정직한 것들</span>, 무엇이든지 <span class="g">공정한 것들</span>,<br>무엇이든지 <span class="g">순수한 것들</span>, 무엇이든지 <span class="g">사랑스러운 것들</span>,<br>무엇이든지 <span class="g">좋은 평판에 속한 것들</span>, <span class="g">이런 것들을 생각하라</span>.</div>
  <div class="src">빌립보서 4:7-8</div>
