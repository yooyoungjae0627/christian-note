  <div class="title"><span class="g">전도도 믿고 맡겨야</span></div>
  <div class="verse">…그들이 너희를 인도하고 너희를 넘겨줄 때면<br>너희가 <span class="g">말할 것을 미리부터 전혀 걱정하지 말며</span><br>너희는 <span class="g">미리 생각해 놓지도 말라</span>.<br>오히려 그 시각에 너희에게 무엇이 주어지든지 너희는 그것을 말하라.<br>이는 말하는 자는 너희가 아닌 성령이시기 때문이라</div>
  <div class="verse">싸울 날을 위하여 마병을 <span class="o">예비</span>하거니와 <span class="g">이김</span>은 여호와께 있느니라</div>
  <div class="src">마가복음 13:11 / 잠언21:31(개역개정)</div>
