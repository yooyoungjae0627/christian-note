  <div class="verse">…그들은 <span class="g">그분의 교리</span>에 <span class="r">깜짝 놀랐더라</span>…<br><span class="r">바리새파</span> 사람들이 한데 모여 있는 동안에 예수님께서 그들에게 물으시며<br>말씀하시기를, “너희는 그리스도에 대하여 어떻게 생각하느냐?<br>그가 누구의 자손이냐?” 하셨느니라. 그들이 그분께 말씀드리기를,<br>“다윗의 자손이니이다.” 하니라.</div>
