  <div class="title"><span class="g">민족의 구분 = 시대의 구분</span></div>
  <div class="verse">높아지려는 생각을 갖지 말고 오직 두려워하라…쓰러진 자들에게는<br>준엄하심이 있으나 너를 향해서는 선하심이 있으니,<br>만일 네가 지속적으로 그분의 선하심 가운데 있다면 그러하리라.<br>그렇지 아니하면 너 또한 <span class="r">잘려 나가리라</span>…부분적으로 <span class="r">눈멀게 됨</span>이<br><span class="dg">이스라엘</span>에게 발생되었으니, <span class="g">이방인들</span>의 충만함이 들어올 때까지라.<br>그런 뒤에 온 <span class="dg">이스라엘</span>이 구원받게 되리라…</div>
