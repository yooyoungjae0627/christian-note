  <div class="title"><span class="tg">낙원이 좋은 이유:</span> <span class="ty tsub">예수님 모습</span></div>
  <div class="verse"><p>그 일곱 등잔대들 한가운데서 발까지 내려오는 의복으로 옷 입혀지고 앞가슴이 금띠로 둘러진 <span class="W">인자</span>와도 같은 분을 보았더라. 그분의 머리와 그분의 머리카락은 <span class="W">양털</span>같이 희고 <span class="W">눈</span>같이 하얗더라. 그리고 그분의 두 눈은 불의 <span class="W">화염</span> 같았더라. 그리고 그분의 두 발은 정제된 놋 같아서 마치 그것들이 <span class="W">용광로</span>에서 달궈진 듯하였더라. 그리고 그분의 음성은 <span class="W">많은 물들의 소리</span> 같았더라… 그리고 그분의 용모는 <span class="W">태양</span>이 그의 기세로 빛나는 것 같았더라.</p></div>
  <div class="src">요한계시록 1:13-16</div>
