  <div class="verse"><p>…내가 <span class="y">새 하늘과 새 땅</span>을 보았더라…나 요한은 거룩한 도성, 곧 하늘에서 하나님께로부터 <span class="W">새 예루살렘</span>이 내려오는 것을 보았는데, 그녀의 남편을 위하여 단장된 <span class="W">신부</span>같이 예비되었더라… “더 이상 사망도 슬픔도 부르짖음도 없을 것이요, 더 이상 아픔도 없을 것이라. 이는 <span class="p">이전 것들</span>이 사라져 버렸기 때문이라.” 그리고 그 보좌 위에 앉으신 분께서 말씀하시기를, “보라, 내가 모든 것들을 <span class="W">새롭게</span> 만드노라.” 하셨느니라…</p></div>
