<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 부활 = 몸이 바뀌는 것: 썩을 몸(점선 사람 모양, 땅에 심긴 씨앗) → 썩지 아니할 몸(빛나는 사람 모양). 얼굴 없는 그림 기호 -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
    <circle cx="100" cy="100" r="86" stroke="#e8c870" stroke-opacity=".5"/>
    <!-- 땅과 심긴 씨앗 -->
    <path d="M30 150 H170" stroke="#e8c870" stroke-opacity=".8"/>
    <ellipse cx="86" cy="161" rx="6" ry="4" stroke="#f3e7c9" stroke-opacity=".7"/>
    <path d="M86 157 C85 154 87 153 86 151" stroke="#f3e7c9" stroke-opacity=".5"/>
    <!-- 왼쪽: 썩을 몸(점선, 흐릿함) -->
    <g stroke="#f3e7c9" stroke-opacity=".55" stroke-dasharray="3.5 3">
      <circle cx="62" cy="60" r="10"/>
      <path d="M46 80 Q46 74 52 74 H72 Q78 74 78 80 V110 H72 V150 H65.5 V118 H58.5 V150 H52 V110 H46 Z"/>
      <path d="M52 86 V110 M72 86 V110"/>
    </g>
    <!-- 가운데 화살표: 바뀜 -->
    <path d="M86 104 H114 M106 96 L114 104 L106 112" stroke="#e8c870"/>
    <!-- 오른쪽: 썩지 아니할 몸(빛나는 금빛) -->
    <ellipse cx="138" cy="102" rx="30" ry="56" stroke="#e8c870" stroke-opacity=".35"/>
    <g stroke="#e8c870">
      <circle cx="138" cy="60" r="10"/>
      <path d="M122 80 Q122 74 128 74 H148 Q154 74 154 80 V110 H148 V150 H141.5 V118 H134.5 V150 H128 V110 H122 Z"/>
      <path d="M128 86 V110 M148 86 V110"/>
    </g>
    <path d="M138 42 V34 M124 46 L119 40 M152 46 L157 40" stroke="#f3e7c9" stroke-opacity=".8"/>
  </g>
  <g fill="#f3e7c9">
    <circle cx="112" cy="70" r="1.4"/><circle cx="166" cy="78" r="1.6"/><circle cx="160" cy="128" r="1.2"/><circle cx="114" cy="134" r="1.2"/>
  </g>
</svg>
