    <path d="M93 67 L100 75 L107 67" stroke="#e8c870"/>
  </g>
  <ellipse cx="100" cy="126" rx="64" ry="52" fill="url(#glowGift79)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2">
    <!-- 선물 상자 -->
    <rect x="66" y="112" width="68" height="50" rx="2" fill="#18233f" fill-opacity=".35" stroke="#e8c870"/>
    <rect x="60" y="98" width="80" height="14" rx="2" fill="#18233f" fill-opacity=".35" stroke="#e8c870"/>
    <path d="M100 98 V162" stroke="#f3e7c9"/>
    <!-- 리본 매듭 -->
    <path d="M100 98 C90 82 74 84 78 92 C81 98 92 99 100 98 Z" stroke="#f3e7c9"/>
    <path d="M100 98 C110 82 126 84 122 92 C119 98 108 99 100 98 Z" stroke="#f3e7c9"/>
    <!-- 바닥 -->
    <path d="M40 162 H160" stroke="#c9973b" stroke-opacity=".85"/>
  </g>
  <!-- 반짝임 -->
  <g fill="#f3e7c9">
    <path d="M48 94 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 Z"/>
    <path d="M152 86 l1.6 4 l4 1.6 l-4 1.6 l-1.6 4 l-1.6 -4 l-4 -1.6 l4 -1.6 Z"/>
