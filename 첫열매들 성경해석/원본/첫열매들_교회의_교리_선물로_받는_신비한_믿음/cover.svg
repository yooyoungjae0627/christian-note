<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 어느 날 선물로 오는 믿음: 위에서 내려오는 빛과 배달된(once delivered) 선물 상자. 얼굴·십자가 없는 그림 기호 -->
  <defs>
    <radialGradient id="glowGift79" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#f3e7c9" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#f3e7c9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
    <circle cx="100" cy="100" r="86" stroke="#e8c870" stroke-opacity=".5"/>
    <!-- 하늘에서 내려오는 빛 -->
    <path d="M100 20 V33 M80 24 L84 36 M120 24 L116 36 M62 34 L69 43 M138 34 L131 43" stroke="#f3e7c9" stroke-opacity=".75" stroke-width="1.6"/>
    <!-- 내려오는 길: 배달 -->
