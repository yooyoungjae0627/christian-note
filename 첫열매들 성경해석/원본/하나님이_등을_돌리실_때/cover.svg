<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 어둠 속에서 일하시는 하나님: 별빛 아래 400년의 어둠(구약 두루마리와 신약 책 사이 점선), 지평선 너머 떠오르는 의의 태양, 한곳으로 모이는 길(모든 길은 로마로) -->
  <g fill="none" stroke="#e8c870" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="100" cy="100" r="86" stroke-opacity=".5"/>
    <!-- 구약 두루마리 -->
    <path d="M40 66 H56 M40 92 H56 M43 66 V92 M53 66 V92" stroke="#f4ecd8"/>
    <circle cx="43" cy="64" r="2.4" stroke="#f4ecd8"/><circle cx="53" cy="64" r="2.4" stroke="#f4ecd8"/>
    <circle cx="43" cy="94" r="2.4" stroke="#f4ecd8"/><circle cx="53" cy="94" r="2.4" stroke="#f4ecd8"/>
    <!-- 신약 펼친 책 -->
    <path d="M142 72 C150 68 156 68 160 72 V90 C156 86 150 86 142 90 Z" stroke="#f4ecd8"/>
    <path d="M160 72 C164 68 170 68 176 72 V90 C170 86 164 86 160 90" stroke="#f4ecd8" stroke-opacity=".9"/>
    <!-- 400년의 침묵: 두 책 사이의 점선 다리 -->
    <path d="M60 78 C80 56 120 56 138 78" stroke-dasharray="3 5" stroke-opacity=".75"/>
    <!-- 지평선과 떠오르는 의의 태양 -->
    <path d="M22 124 H178" stroke="#9fc3ff" stroke-opacity=".7"/>
    <path d="M80 124 A20 20 0 0 1 120 124" stroke="#f4ecd8"/>
    <path d="M100 96 V88 M82 104 L76 98 M118 104 L124 98 M72 116 H64 M128 116 H136" stroke="#f4ecd8" stroke-opacity=".7"/>
    <!-- 한곳으로 모이는 길 -->
    <path d="M50 166 L94 126 M150 166 L106 126" />
    <path d="M100 178 V132" stroke-dasharray="5 5" stroke-opacity=".7"/>
    <path d="M72 172 L97 128 M128 172 L103 128" stroke="#9fc3ff" stroke-opacity=".45"/>
  </g>
  <g fill="#f4ecd8">
    <circle cx="70" cy="40" r="1.4"/><circle cx="130" cy="36" r="1.6"/><circle cx="100" cy="28" r="1.2"/>
    <circle cx="84" cy="50" r="1"/><circle cx="118" cy="48" r="1.1"/><circle cx="150" cy="52" r="1.3"/><circle cx="52" cy="50" r="1.2"/>
  </g>
</svg>
